<script>
/* Horizontal siempre. En un movil o tableta en vertical la pagina entera se gira
   90° (html.rot): el juego se ve tumbado aunque el movil tenga el giro
   bloqueado. Todo el CSS mide con --vw/--vh y clases (vp, vl, h600, h430, w480)
   en vez de vw/vh y @media, porque esas siguen la pantalla fisica y aqui
   manda la girada. Fuera de .rot las clases copian las @media de siempre, asi
   que escritorio y movil tumbado quedan exactamente igual. */
(function(){
  var de=document.documentElement,c=de.classList,s=de.style;
  function mq(q){return matchMedia(q).matches;}
  function dev(){return mq('(pointer:coarse)')||(navigator.maxTouchPoints>0&&!mq('(pointer:fine)'));}
  var lw=0,sig='',D={rw:0,rh:0};
  function upd(){
    var w=innerWidth,h=innerHeight,a=document.activeElement;
    // Con el teclado abierto cambia solo el alto: no se gira ni se recoloca nada.
    if(c.contains('rot')&&a&&a.tagName==='INPUT'&&w===lw)return;
    // Solo con la pantalla en vertical (no una ventana alta en pantalla partida).
    var so=screen.orientation&&screen.orientation.type,sp=so?so.indexOf('portrait')===0:screen.height>screen.width;
    var rot=dev()&&h>w&&sp;c.toggle('rot',rot);lw=w;D.rw=rot?h:w;D.rh=rot?w:h;
    if(rot){s.setProperty('--vw',h/100+'px');s.setProperty('--vh',w/100+'px');s.setProperty('--rw',h+'px');s.setProperty('--rh',w+'px');s.setProperty('--rx',Math.round(w*(devicePixelRatio||1))/(devicePixelRatio||1)+'px');
      c.remove('vp');c.add('vl');c.toggle('h600',w<=600);c.toggle('h430',w<=430);c.toggle('w480',h>=480);}
    else{['--vw','--vh','--rw','--rh','--rx'].forEach(function(k){s.removeProperty(k);});
      c.toggle('vp',mq('(orientation:portrait)'));c.toggle('vl',mq('(orientation:landscape)'));
      c.toggle('h600',mq('(max-height:600px)'));c.toggle('h430',mq('(max-height:430px)'));c.toggle('w480',mq('(min-width:480px)'));}
    // Si cambió el giro o la medida, el juego se recoloca ya (no espera a otro resize).
    var g=rot+','+w+','+h;if(sig&&g!==sig){sig=g;dispatchEvent(new Event('resize'));}sig=g;
  }
  upd();addEventListener('resize',upd);addEventListener('focusout',function(){setTimeout(upd,60);});
  addEventListener('orientationchange',function(){upd();setTimeout(upd,100);});
  D.dev=dev;D.upd=upd;window.DSV=D;
})();
</script>

<style>
/* Mundo arcade oscuro unico. Escritorio: monitor 16:9 que llena la ventana.
   Movil vertical: juego arriba + mandos grandes abajo. Movil horizontal: juego a pantalla completa con mandos superpuestos. */
:root{color-scheme:dark;--bg:#06070d;--ink:#eef3ff;--dim:#8f98c8;--acc:#ff3d6e;--yel:#ffd23f;--cy:#3de8ff;--grn:#4dff88;--panel:#121730;--line:#3a4680;--pix:'Press Start 2P',ui-monospace,Menlo,monospace;--bt:68px;--ar:1.7778;
  --vw:1vw;--vh:1vh;--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
#ld{position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:var(--pix)}#ld b{font-weight:400;font-size:clamp(22px,9vmin,56px);color:var(--acc);text-shadow:0 .06em #7a1030,.05em .12em #000}#ld i{display:block;width:min(calc(60*var(--vw)),320px);height:10px;border:2px solid var(--line);padding:2px}#ld s{display:block;height:100%;width:4%;background:var(--cy);transition:width .15s}#ld small{color:var(--dim);font-size:10px;letter-spacing:.1em}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--pix);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 16px;touch-action:manipulation}
body.big{--bt:84px}
#wrap{position:relative;flex:none;max-width:100%;background:#000;overflow:hidden;line-height:0;box-shadow:0 0 0 2px var(--line),0 0 40px #3de8ff22}
canvas{display:block;image-rendering:pixelated}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;overflow:auto;z-index:5;overscroll-behavior:contain;background:rgba(6,7,13,.9);
  padding:max(10px,calc(2*var(--vh))) max(12px,calc(12px + var(--sar))) max(10px,calc(2*var(--vh))) max(12px,calc(12px + var(--sal)))}
.ov[hidden]{display:none!important}
.ov .panel{zoom:var(--ui,1)}
.panel{width:100%;max-width:min(640px,calc(96*var(--vw)));margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(5px,calc(1.5*var(--vh)),12px);font-size:clamp(9px,min(calc(1.7*var(--vw)),calc(2.4*var(--vh))),14px);line-height:1.6}
.panel h1{margin:0;font-weight:400;font-size:clamp(26px,min(calc(12*var(--vw)),calc(17*var(--vh))),88px);line-height:.95;color:var(--acc);text-shadow:0 .06em #7a1030,.05em .12em #000;text-wrap:balance}
.panel h2{margin:0;font-weight:400;font-size:clamp(13px,min(calc(3.4*var(--vw)),calc(4.6*var(--vh))),26px);color:var(--yel);text-shadow:2px 2px #000;text-wrap:balance}
.panel h3{margin:0;font-weight:400;font-size:clamp(10px,min(calc(2*var(--vw)),calc(2.8*var(--vh))),15px);color:var(--cy)}
.kick{color:var(--cy);letter-spacing:.12em;margin:0}
.dim{color:var(--dim);margin:0;max-width:min(52ch,96%)}
.menu{display:flex;flex-direction:column;gap:clamp(5px,calc(1.2*var(--vh)),8px);width:min(100%,340px)}
.btn{font:inherit;font-size:1em;color:var(--ink);background:var(--panel);border:2px solid var(--line);min-height:clamp(30px,calc(6*var(--vh)),46px);padding:.55em .9em;cursor:pointer;border-radius:4px;touch-action:manipulation;text-align:center}
.btn:hover,.btn:focus-visible{background:var(--line);outline:2px solid var(--yel);outline-offset:2px}
.btn.hot{background:#10351f;border-color:var(--grn);color:#c6ffd9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.opt i{font-style:normal;color:var(--yel)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats{display:grid;grid-template-columns:1fr auto;gap:clamp(2px,calc(.6*var(--vh)),4px) 18px;width:min(100%,380px);text-align:left;font-variant-numeric:tabular-nums}
.stats b{font-weight:400;color:var(--yel);text-align:right}
.stats .tot{color:var(--grn);border-top:1px solid var(--line);padding-top:4px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px;width:100%}
.item{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:left;line-height:1.6}
.item span{display:flex;justify-content:space-between;gap:8px}
.item small{color:var(--dim);font-size:.85em}
.item .c{color:var(--yel);font-style:normal}
.pips{color:var(--cy);letter-spacing:2px}
.coins{color:var(--yel);margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:clamp(3px,calc(.9*var(--vh)),6px) 16px;text-align:left;width:min(100%,520px)}
.keys b{font-weight:400;color:var(--yel)}
ol.rank{list-style:none;padding:0;margin:0;width:min(100%,480px);font-variant-numeric:tabular-nums}
ol.rank li{display:grid;grid-template-columns:2.6em 3.6em 1fr auto;gap:8px;padding:4px 6px;border-bottom:1px solid var(--panel);text-align:left}
ol.rank li:first-child{color:var(--yel)}
ol.rank li.me{background:#10351f;color:#c6ffd9}
ol.rank .x{color:var(--dim)}
#tag{font:inherit;font-size:16px;width:6em;min-height:clamp(32px,calc(6*var(--vh)),46px);text-transform:uppercase;text-align:center;background:#000;color:var(--yel);border:2px solid var(--line);padding:.5em;border-radius:4px;-webkit-user-select:text;user-select:text}
#tag:focus-visible{outline:2px solid var(--yel)}
.tgs{align-items:center}.tgc{display:flex;flex-direction:column;align-items:center;gap:4px}.tgc b{font-weight:400;font-size:22px;line-height:1;color:var(--yel);background:#000;border:2px solid var(--line);border-radius:4px;padding:.3em .35em;min-width:1.7em;text-align:center}.tgc b.on{border-color:var(--yel)}.tgb{min-width:44px;min-height:34px;padding:.2em .6em}
.note{color:var(--grn);min-height:1.7em;margin:0}
.lore{margin:0;max-width:min(46ch,96%);text-align:left;line-height:1.75}.ill{display:block;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;outline:2px solid #1a1530}.tapes .btn{text-align:left;padding:6px 10px;min-height:34px}html.w480 .menu.tapes{display:grid;grid-template-columns:1fr 1fr;width:min(100%,680px)}
.lkw{display:flex;gap:clamp(8px,calc(2*var(--vw)),18px);align-items:center;justify-content:center;width:100%;flex-wrap:wrap}
#lkc{width:168px;height:168px;flex:none;image-rendering:pixelated;background:radial-gradient(circle at 50% 62%,#1d2350 0,#0b0e1f 70%);border:2px solid var(--line);border-radius:6px}
.lkm{width:min(100%,360px)}
.lkm .opt i.lock{color:var(--acc)}
html.h600 #lkc{width:112px;height:112px}html.h600 .lkw{flex-wrap:nowrap}html.h600 .lkh{display:none}html.h600 .lkm{display:flex;flex-direction:column;width:min(100%,360px)}html.h600 .lkm .btn{min-height:28px;padding:.35em .8em}
/* ---- mandos tactiles ---- */
#touch{display:none;position:relative;width:100%;touch-action:none}
body.touch #touch{display:flex}
#stick{position:relative;flex:1;min-width:0;touch-action:none}
#stick .base,#stick .knob{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#stick .base{width:calc(var(--bt)*1.7);height:calc(var(--bt)*1.7);border:2px solid var(--line);background:#12173088}
#stick .knob{width:calc(var(--bt)*.8);height:calc(var(--bt)*.8);background:var(--line);border:2px solid var(--cy)}
#stick .lbl{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px;color:var(--dim);pointer-events:none}
#btns{position:relative;width:46%;flex:0 0 auto;touch-action:none}
#btns button{position:absolute;pointer-events:none}
#btns button,#tp{font-family:var(--pix);font-size:10px;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:50%;touch-action:none;padding:0;width:var(--bt);height:var(--bt);-webkit-tap-highlight-color:transparent}
#btns .j{border-color:var(--cy);background:#0f2c36;font-size:11px}
#btns .f{border-color:var(--acc)}
#btns .f.auto{border-style:dashed}
#btns .bs{border-color:var(--yel)}
#btns .j small{display:block;font-size:6px;line-height:1.3;margin-top:4px;color:var(--grn);opacity:.9}
#btns .j.dash{border-color:var(--grn);background:#12361f}
#btns button.on,#tp.on{background:var(--line);transform:scale(.94)}
#btns .bs.ready{background:#4a3a08;box-shadow:0 0 14px var(--yel)}
#tp{position:absolute;top:6px;right:0;width:44px;height:44px;border-radius:8px;font-size:11px}
#rot{position:absolute;top:10px;left:0;right:56px;text-align:left;font-size:9px;color:var(--dim);line-height:1.6;pointer-events:none}
body:not(.ingame) #touch .ctl{visibility:hidden}
/* Vertical (html.vp = la antigua @media orientation:portrait) */
html.vp body.touch{justify-content:flex-start;padding-top:calc(8px + var(--sat))}
html.vp body.touch #touch{flex:1;min-height:0;align-items:stretch;gap:12px;padding-top:56px;padding-bottom:var(--sab)}
html.vp body.touch #stick .base{left:50%;top:60%}
html.vp body.touch #stick .knob{left:50%;top:60%}
/* Apaisado (html.vl), tambien con la pagina girada */
html.vl body.touch{padding:0 var(--sar) 0 var(--sal)}
html.vl body.touch #wrap{box-shadow:none}
html.vl body:not(.ingame){padding:0}
html.vl body:not(.ingame) #wrap{box-shadow:none}
html.vl body.touch #touch{position:fixed;top:0;right:0;bottom:0;left:0;z-index:4;pointer-events:none}
html.vl body.touch #stick{position:absolute;left:0;bottom:0;width:42%;height:72%;pointer-events:auto}
html.vl body.touch #stick .base{left:calc(var(--bt)*1.1 + var(--sal));top:calc(100% - var(--bt)*1.1)}
html.vl body.touch #stick .knob{left:calc(var(--bt)*1.1 + var(--sal));top:calc(100% - var(--bt)*1.1)}
html.vl body.touch #stick .lbl{display:none}
html.vl body.touch #btns{position:absolute;pointer-events:auto}
html.vl body.touch #btns button{opacity:.5}
html.vl body.touch #tp{top:8px;right:calc(8px + var(--sar));pointer-events:auto;opacity:.7}
html.vl body.touch #rot{display:none}
/* Pantalla baja (movil tumbado, portatil): los botones pasan a dos columnas
   para que el menu entero quepa sin tener que desplazar. */
/* html.h600 = alto de 600 px o menos */
html.h600 .menu{display:grid;grid-template-columns:1fr 1fr;width:min(100%,560px)}
html.h600 .menu .hot{grid-column:1/-1}
html.h600 .keys{grid-template-columns:auto 1fr auto 1fr;width:min(100%,760px)}
html.h430 .panel{line-height:1.45}html.h430 .shop{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
html.vl body.touch #stick:not(.act) .base,html.vl body.touch #stick:not(.act) .knob{opacity:.35}
/* Portada: el panel deja ver la escena del juego que corre por detras. */
.ov.title{background:linear-gradient(180deg,rgba(6,7,13,.74) 0%,rgba(6,7,13,.34) 30%,rgba(6,7,13,.10) 54%,rgba(6,7,13,.42) 80%,rgba(6,7,13,.74) 100%)}
.ov.title .panel{gap:10px}
html.vp .ov.title .panel{margin-top:0}html.vp .ov.title h1{font-size:clamp(24px,min(calc(11*var(--vw)),calc(7*var(--vh))),64px)}html.vp .ov.title{align-items:flex-start;top:var(--cvb,0);background:linear-gradient(180deg,rgba(6,7,13,.2),rgba(6,7,13,.85) 40%)}
.ov.title .kick,.ov.title .dim{text-shadow:0 2px 0 #000,0 0 8px #000,0 0 16px #000}
.ov.title h1{text-shadow:0 .06em #7a1030,.05em .12em #000,0 0 .5em #000}
.ov.title .btn{background:rgba(18,23,48,.88);box-shadow:0 2px 0 #000a}
.ov.title .btn:focus-visible,.ov.title .btn.hot{background:rgba(24,46,34,.92)}
@keyframes titleIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ov.title .panel{animation:titleIn .35s ease-out}
/* ---- Piel de los menus: tarjeta con filo de color, botones con bisel de
   pixel (luz arriba, sombra abajo) y valores en ficha. Sin brillos de mas:
   el unico resplandor es el del foco. ---- */
.ov{background:repeating-linear-gradient(0deg,#0000 0 2px,#0000001f 2px 3px),radial-gradient(ellipse at 50% 40%,rgba(14,17,34,.86),rgba(4,5,10,.95) 75%)}
.ov:not(.title) .panel{position:relative;background:linear-gradient(180deg,#161c3cf2,#0c1024f2);border:2px solid #2b3570;border-radius:6px;
  box-shadow:0 0 0 2px #05060c,inset 0 1px 0 #ffffff12,0 14px 40px #000c;padding:clamp(10px,calc(2.6*var(--vh)),24px) clamp(12px,calc(2.6*var(--vw)),30px)}
.ov:not(.title) .panel::before{content:'';position:absolute;left:14px;right:14px;top:-2px;height:2px;background:linear-gradient(90deg,#0000,var(--acc) 18%,var(--yel) 50%,var(--cy) 82%,#0000)}
.panel.wide{max-width:min(860px,calc(96*var(--vw)))}
/* Las cintas del archivo van justas de alto (texto + ilustracion): tarjeta casi sin relleno. */
.ov:not(.title) .panel.tape{padding:6px 10px;max-width:min(664px,calc(96*var(--vw)))}html.h430 .ov:not(.title) .panel.tape{padding:0 8px;border-top-width:0;border-bottom-width:0}
.panel h2{letter-spacing:.04em}
.btn{background:linear-gradient(180deg,#1b2350,#121730);box-shadow:inset 0 2px 0 #ffffff14,inset 0 -3px 0 #00000059;transition:background-color .12s,border-color .12s,transform .06s}
.btn:hover,.btn:focus-visible{background:linear-gradient(180deg,#2a3672,#1c2452);border-color:#5b6bb8;outline:2px solid var(--yel);outline-offset:2px}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 2px 0 #00000059,inset 0 -1px 0 #ffffff10}
.btn.hot{background:linear-gradient(180deg,#17502e,#0d2e1b);border-color:var(--grn);color:#d4ffe3;box-shadow:inset 0 2px 0 #ffffff1c,inset 0 -3px 0 #0000005c}
.btn.hot:hover,.btn.hot:focus-visible{background:linear-gradient(180deg,#1f6a3d,#123d24)}
.btn.warn{background:linear-gradient(180deg,#4a1426,#2a0b16);border-color:var(--acc);color:#ffd6e0}
.btn.warn:hover,.btn.warn:focus-visible{background:linear-gradient(180deg,#62193a,#3a0f1f)}
.btn:disabled{box-shadow:none}
.opt i{padding:.2em .5em;background:#0000004d;border:1px solid #ffd23f40;border-radius:3px;line-height:1.2;white-space:nowrap}
.btn.cont small{display:block;margin-top:.35em;font-size:.72em;color:#8fe0b0;letter-spacing:.02em}html.h430 .btn.cont small{display:inline;margin:0 0 0 .6em}
.panel .menu.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(15em,calc(50% - 5px)),1fr));width:min(100%,780px)}
.panel .menu.two .hot{grid-column:1/-1}
.stats span{color:var(--dim)}.stats{padding:.5em .8em;background:#00000033;border:1px solid #232c5c;border-radius:4px}
ol.rank li:nth-child(even){background:#ffffff06}
.item{border-color:#2f3a78}.item .c{padding:0 .4em;background:#0000004d;border-radius:3px}
/* ranuras de guardado */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(min(100%,15em),calc(33.4% - 6px)),1fr));gap:8px;width:100%}
.btn.slot{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:.8em;row-gap:.25em;align-items:center;text-align:left;padding:.6em .8em .6em .5em;line-height:1.35}
.slot .sn{grid-row:1/-1;align-self:stretch;display:flex;align-items:center;justify-content:center;min-width:1.7em;padding-right:.55em;border-right:1px solid #ffffff1a;font-size:1.7em;color:var(--cy);text-shadow:2px 2px #000}
.slot .sl{display:flex;justify-content:space-between;align-items:center;gap:.6em;min-width:0;white-space:nowrap}
.panel.sl3{max-width:min(1000px,calc(96*var(--vw)))}.slot .sl b{font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis}
.slot .sl i{flex:none;font-style:normal;font-size:.78em;color:var(--yel);padding:.15em .4em;background:#0000004d;border-radius:3px}
.slot .sd,.slot .sm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.slot .sm{display:flex;justify-content:space-between;gap:.6em;font-size:.78em}.slot .sm b{font-weight:400;color:var(--ink)}
.slot.empty{border-style:dashed;background:#0b0f22b3;box-shadow:none}.slot.empty .sn{color:#4a578f}.slot.empty .sl{color:var(--dim)}
.slot.done .sl{color:var(--grn)}
.dim.sv{color:#8fe0b0;font-size:.85em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Pagina girada (ver la cabecera): el body mide el viewport tumbado y se gira
   90° desde su esquina. Arriba de la pagina queda en el borde derecho del
   cristal, asi que el movil se coge girado a la izquierda, como cualquier juego
   apaisado. Los margenes seguros siguen al cristal: la muesca de arriba pasa a
   la izquierda y la barra de abajo, a la derecha. */
html.rot{--sal:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-left,0px)}
html.rot,html.rot body{overflow:hidden}
html.rot body{position:fixed;top:0;left:0;width:var(--rw);height:var(--rh);transform-origin:0 0;transform:translateX(var(--rx,var(--rh))) rotate(90deg)}
#ld.gate{cursor:pointer}#ld.gate i{display:none}#ld.gate small{color:var(--yel);font-size:12px;animation:gateB 1.1s steps(2,start) infinite}
@keyframes gateB{50%{opacity:.35}}
</style>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
// Pagina girada (html.rot, ver la cabecera): todo lo que mide la pantalla o lee
// el dedo pasa por aqui y trabaja en coordenadas de la pagina tumbada, no en
// las del cristal. Sin giro devuelven lo mismo que innerWidth, clientX, etc.
function ROT(){return document.documentElement.classList.contains('rot');}
function VW(){return ROT()?DSV.rw:innerWidth;}
function VH(){return ROT()?DSV.rh:innerHeight;}
function vrect(el){var r=el.getBoundingClientRect();if(!ROT())return r;var w=DSV.rh;
  return {left:r.top,top:w-r.right,right:r.bottom,bottom:w-r.left,width:r.height,height:r.width};}
function vpt(e){return ROT()?{x:e.clientY,y:DSV.rh-e.clientX}:{x:e.clientX,y:e.clientY};}
var cv=$('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
// W x H es lo que se VE (ventana de camara); WH es el alto real de la columna
// del mundo (15 filas de 12 px). CY es cuanto cielo vacio se recorta por arriba:
// el suelo queda pegado al borde de abajo y el jugador se ve un 67 % mas grande.
var W=192,H=108,T=12,ROWS=15,GY=13*T,WH=ROWS*T,CY=WH-H;
// CYM: tope real de la camara. Por debajo del suelo solo hace falta una fila de
// baldosas; dejar las dos gastaba el 22 % de la pantalla en un bloque negro.
var CYM=CY-12;
var HS=.78,HW=Math.round(W/HS),HH=Math.round(H/HS);  // lienzo logico del HUD
// SC: el lienzo tiene SC veces mas pixeles reales que el mundo logico (320x180).
// Todo el dibujo sigue en coordenadas logicas: draw() aplica la escala una sola
// vez, asi que fisica, colisiones y cajas no cambian. Los sprites de imagen se
// pintan a su tamano nativo (SC veces la caja logica), o sea 1:1 sin perdida.
var SC=4;
// Ventana adaptable CON PIXEL CUADRADO. Regla del proyecto: un pixel del juego
// mide siempre un numero ENTERO de pixeles de la pantalla, nunca 1,6 ni 2,45.
// Si no, el navegador reparte cada pixel en unos de 2 y otros de 3 y el sprite
// se deforma (la cara sale con unas lineas el doble de gruesas que otras).
// Se busca la escala entera MAS GRANDE que deje ver al menos HMIN de alto y
// WMIN de ancho; el alto logico se ajusta entre HMIN y 108 y el ancho entre
// WMIN y 264, asi el lienzo llena la pantalla sin estirar ningun pixel.
// Con el movil tumbado el juego ocupa la pantalla entera y el mando flota,
// semitransparente, sobre los bordes (donde no hay accion).
var ZOOM=1,HMIN=90,HUDR=0;
function fitW(){
  var bc=document.body.classList,land=VW()>VH();
  // Tumbado en tactil, y tambien en la portada de cualquier pantalla apaisada, el
  // lienzo llena la pantalla: el logo queda siempre DENTRO de la escena.
  var tch=land&&(bc.contains('touch')||!bc.contains('ingame'));
  var cs=getComputedStyle(document.body),padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  var dpr=Math.min(3,window.devicePixelRatio||1);
  var aw=Math.max(64,VW()-(tch?padX:32)),ah=Math.max(64,VH()-(tch?0:16));
  // Hueco medido en pixeles REALES de la pantalla: es ahi donde el pixel tiene
  // que cuadrar, no en pixeles CSS (un movil pinta 2 o 3 reales por cada CSS).
  var dw=aw*dpr,dh=ah*dpr,wmin=tch?160:192;
  var nw=0,nh=108,z=Math.floor(dh/(SC*HMIN));
  for(;z>=1;z--){var hc=Math.min(108,Math.floor(dh/(SC*z))),wc=Math.floor(dw/(SC*z)/2)*2;
    if(wc>=wmin){nw=Math.min(264,wc);nh=hc;break;}}
  if(!nw){
    // Ventana enana: ni a escala 1 cabe el juego, asi que se reduce con escala
    // fraccionaria. Unico caso sin pixel cuadrado, y ahi fitPx deja que el
    // navegador interpole para que no salga a dentelladas.
    z=Math.min(dw/(192*SC),dh/(108*SC));nw=192;nh=108;
  }
  var cw=nw*SC,chh=nh*SC;
  if(nw===W&&nh===H&&z===ZOOM&&cv.width===cw&&cv.height===chh){uiFit();return;}
  W=nw;H=nh;ZOOM=z;HW=Math.round(W/HS);HH=Math.round(H/HS);
  CY=WH-H;CYM=CY-12;if(camY>CYM)camY=CYM;
  cv.width=cw;cv.height=chh;g.imageSmoothingEnabled=false;
  // Tamano en pantalla = tamano del lienzo x escala, devuelto a pixeles CSS.
  cv.style.width=(cw*z/dpr)+'px';
  cv.style.height=(chh*z/dpr)+'px';
  titleTop();uiFit();
}
// Tamano de la interfaz (OPCIONES, como la escala de interfaz de Minecraft). SET.ui es
// 'auto' o un numero de 0,5 a 1 sobre el tamano de siempre. UIF escala el HUD del
// lienzo (marcador, carteles); los menus solo encogen con un valor puesto a mano y
// como mucho al 80 %, para que la letra no baje de lo legible. En AUTO el HUD busca
// un pixel de VH/240 px CSS (1,5 a 3,6): ~13 px de letra en un movil tumbado.
var UIF=1,UIS=['auto',.5,.6,.7,.8,.9,1];
function uiFit(){var f=SET.ui,r=vrect(cv),cp=r.width&&cv.width?r.width/cv.width:.25;
  if(typeof f!=='number')f=clamp(VH()/240,1.5,3.6)/(SC*HS*cp);
  UIF=clamp(f,.5,1);var m=typeof SET.ui==='number'?Math.min(1,.6+.4*SET.ui):1;
  document.documentElement.style.setProperty('--ui',m.toFixed(3));}
function uiName(){return typeof SET.ui==='number'?Math.round(SET.ui*100)+' %':'AUTO';}
// En vertical el lienzo va arriba y no cabe el menu dentro: el panel de portada
// empieza justo debajo del lienzo, asi el logo queda FUERA del marco del todo.
function titleTop(){var r=vrect(cv);document.body.style.setProperty('--cvb',Math.round(r.bottom+6)+'px');}
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var DEBUG=location.hash==='#debug';
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(n){var v=Math.sin(n*91.7+17.3)*24634.6345;return v-Math.floor(v);}
function rng(s){s=s>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function hitR(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function hitO(a,b){return hitR(a.x,a.y,a.w,a.h,b.x,b.y,b.w,b.h);}
function pad(n,l){n=Math.max(0,Math.floor(n));return ('00000000'+n).slice(-l);}

function chunkGrid(c){
  var r=c.r,len=0,i,out=[];for(i=0;i<r.length;i++)len=Math.max(len,r[i].length);
  for(i=0;i<ROWS-r.length;i++)out.push('');
  return out.concat(r).map(function(s){while(s.length<len)s+='.';return s;});
}

function buildStage(n){
  var L=LEVELS[n],S=STAGES[L.r];
  var seq=SEQ[n].concat(['box','arena']);
  var grids=seq.map(function(s){return chunkGrid(CH[s]);});
  COLS=grids.reduce(function(a,gr){return a+gr[0].length;},0);
  map=new Uint8Array(COLS*ROWS);
  var ents=[],x0=0,arenaX=0;
  grids.forEach(function(gr,ci){
    if(seq[ci]==='arena')arenaX=x0*T;
    for(var y=0;y<ROWS;y++)for(var x=0;x<gr[y].length;x++){
      var ch=gr[y][x],cx=x0+x;
      if(ch==='#')map[y*COLS+cx]=1;else if(ch==='!')map[y*COLS+cx]=4;else if(ch==='=')map[y*COLS+cx]=2;else if(ch==='^')map[y*COLS+cx]=3;
      else if(ch!=='.')ents.push({ch:ch,x:cx*T,y:y*T});
    }
    x0+=gr[0].length;
  });
  var sw=0;while(sw<COLS&&tileAt(sw,13)===1)sw++;
  camY=CYM;st={n:L.r,i:n,d:n*3/(LEVELS.length-1),L:L,S:S,arenaX:arenaX,safeW:Math.max(W+24,sw*T),lock:0,bossDone:0,clearT:0,cp:{x:36,y:GY-14},cps:[],trg:[],t:0,hurtFree:1,coinsAt:run.coins};
  bullets=[];ebul=[];enemies=[];pickups=[];parts=[];pops=[];ghosts=[];mplats=[];hazards=[];trains=[];boss=null;ring=null;
  ents.forEach(function(e){
    if(e.ch==='o')pickups.push({type:'coin',x:e.x+2,y:e.y+2,w:8,h:8,stat:1,l:-1});
    else if(e.ch==='+')pickups.push({type:'hp',x:e.x+2,y:e.y+4,w:8,h:8,stat:1,l:-1});

    // T: aviso de tren. Al pasar, suena la bocina y el tren barre la via de derecha a izquierda.
    else if(e.ch==='T')st.trg.push({x:e.x,w:0,s:0});

     inv:60,cool:0,mf:0,anim:0,hp:run.maxHp,dead:0,deadT:0,safe:{x:36,y:GY-14},aimU:0,aimD:0};

// Explosion de pixel: bola de fuego que crece (blanco, amarillo, naranja, rojo),

  if(boss&&boss.on&&Math.hypot(boss.x+boss.w/2-x,boss.y+boss.h/2-y)<44)damageBoss(6);

// Disco de pixel: una fila de rect por cada linea, sin antialias.
function disk(cx,cy,r,c){if(r<.5)return;g.fillStyle=c;var R=Math.round(r);for(var dy=-R;dy<=R;dy++){var h=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy)));g.fillRect(Math.round(cx)-h,Math.round(cy)+dy,h*2+1,1);}}

  for(var dy=-R;dy<=R;dy++){var o=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy))),q=r-1.6,ii=Math.abs(dy)<q?Math.floor(Math.sqrt(q*q-dy*dy)):-1;

var WPN={N:{n:'NORMAL',c:'#ffd23f',cd:9},S:{n:'ABANICO',c:'#ff8a2a',cd:14},L:{n:'LÁSER',c:'#3de8ff',cd:15},H:{n:'NOTAS',c:'#4dff88',cd:13}};
function targets(){var a=[];enemies.forEach(function(e){if(!e.dead&&e.type!=='X'&&e.x>cam-6&&e.x<cam+W+6)a.push({x:e.x+e.w/2,y:e.y+e.h/2,box:e.type==='*'});});
  if(boss&&boss.on)a.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,boss:1});return a;}

  targets().forEach(function(q){var dx=q.x-px;if(front&&dx*p.face<-6)return;var d=Math.hypot(dx,(q.y-py)*1.4);if(d<range&&d<bd){bd=d;best=q;}});return best;}

  else if(SET.assist){var q=nearestTarget(150,true);if(q){var ddx=q.x-(p.x+4),ddy=q.y-(p.y+7);
    if(ddy<-24&&Math.abs(ddx)<20){dx=0;dy=-1;}else if(ddy<-16&&-ddy>Math.abs(ddx)*.35){dx=p.face*.72;dy=-.72;}else if(!p.ground&&ddy>18&&ddy>Math.abs(ddx)*.35){dx=p.face*.72;dy=.72;}}}
  var mx=p.x+4+dx*8,my=p.y+6+dy*8,lv=run.lv,w=run.wpn;
  function b(vx,vy,o){o=o||{};bullets.push({x:mx,y:my,vx:vx,vy:vy,l:o.l||55,dmg:o.dmg||1,pierce:o.pierce||0,home:o.home||0,w:w,hitL:[]});run.stats.shots++;}
  var sp=6.5;

    if(lv<2)b(dx*sp,dy*sp);
    else{var ox=-dy*2.5,oy=dx*2.5;b(dx*sp+0,dy*sp);bullets[bullets.length-1].x+=ox;bullets[bullets.length-1].y+=oy;b(dx*sp,dy*sp);bullets[bullets.length-1].x-=ox;bullets[bullets.length-1].y-=oy;}
    if(lv>=3)bullets.forEach(function(q){if(q.l===55&&q.w==='N')q.dmg=1.4;});

function updatePlayer(i){

  p.aimU=!!i.U;p.aimD=!!i.D&&!p.ground;
  var mv=(i.R?1:0)-(i.L?1:0);
  if(p.onMp){p.x+=p.onMp.dx;p.y+=p.onMp.dy;}
  if(p.dash>0){
    p.dash--;p.vx=p.face*4.6;p.vy=0;if(t%2===0)ghosts.push({x:p.x,y:p.y,f:p.face,l:14});
  }else{

    p.vy=Math.min(p.vy+(p.vy>0?.27:.22),5.5);

  }
  if(p.ground){p.coyote=6;p.jumps=0;p.airDash=1;}else if(p.coyote>0)p.coyote--;
  if(i.Jp)p.jbuf=7;else if(p.jbuf>0)p.jbuf--;

    if(i.D&&p.ground&&p.onOne){p.drop=12;p.jbuf=0;p.y+=1;p.ground=0;p.onMp=null;}
    else if(p.coyote>0){p.vy=-4.45;p.coyote=0;p.jbuf=0;p.jumps=1;p.ground=0;p.onMp=null;sfx('jump');burst(p.x+4,p.y+p.h,['#8f98c8'],4,.8,.02);}

  }
  if(i.DAp&&p.dashCd<=0&&!p.dash&&(p.ground||p.airDash)){
    if(mv)p.face=mv;p.dash=11;p.dashCd=Math.round(48*(1-.25*run.up.dash));if(!p.ground)p.airDash=0;sfx('dash');p.inv=Math.max(p.inv,12);
  }
  if(p.dashCd>0)p.dashCd--;if(p.drop>0)p.drop--;

  moveX(p);
  var pb=moveY(p);var m=onMplat(p,pb);p.onMp=m;
  if(st.lock){p.x=clamp(p.x,st.arenaX+4,st.arenaX+W-p.w-4);}
  if(p.x<2)p.x=2;
  if(!wasG&&p.ground){sfx('land');burst(p.x+4,p.y+p.h,['#8f98c8'],3,.6,.02);}
  p.anim=p.vx?p.anim+Math.abs(p.vx)*.11:0;

  // pinchos
  var x0=Math.floor((p.x+1)/T),x1=Math.floor((p.x+p.w-1)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h-1)/T);
  for(var cy=y0;cy<=y1;cy++)for(var cx=x0;cx<=x1;cx++)if(tileAt(cx,cy)===3&&p.y+p.h>cy*T+6){hurt(1);if(!p.dead)p.vy=-3.8;}
  if(p.ground&&!p.onMp&&tileAt(Math.floor(p.x/T),Math.floor((p.y+p.h+1)/T))===1&&tileAt(Math.floor((p.x+p.w)/T),Math.floor((p.y+p.h+1)/T))===1)p.safe={x:p.x,y:p.y};
  if(p.y>WH+16)fallPit();
  var wantF=i.F;
  if(!wantF&&autoFire()&&!p.dead){var q=nearestTarget(150,false);if(q){wantF=true;if(!(i.L||i.R)&&q.x<p.x+4!==(p.face<0))p.face=q.x<p.x+4?-1:1;}}
  if(wantF&&p.cool<=0&&!p.dash)shoot(i);
  if(i.Bp&&run.bass>=100)bassDrop();

      pickups.push({type:'wpn',wt:opts[Math.floor(Math.random()*opts.length)],x:e.x,y:e.y,w:10,h:10,vy:-2.5,l:-1});addScore(e.pts,e.x,e.y-8);}

      else if(r<.4)pickups.push({type:'hp',x:e.x+2,y:e.y,w:8,h:8,vy:-2.2,l:420});}

  }

function aimAt(x,y,sp){var dx=p.x+4-x,dy=p.y+7-y,d=Math.hypot(dx,dy)||1;return [dx/d*sp,dy/d*sp];}
function updateEnemies(){

        if(e.chg>0){e.vx=0;if(--e.chg===0){e.run=34;sfx('dash');}e.vy=Math.min(e.vy+.25,5);moveY(e);break;}

        e.vx=e.dir*e.sp*(adx<90?1.5:1);e.vy=Math.min(e.vy+.25,5);
        if(moveX(e)){if(EV.wHop&&e.ground&&!e.hop){e.vy=-3.6;e.hop=1;}else{e.dir*=-1;e.hop=0;}}

          if(adx<EV.fRange&&p.y>e.y&&--e.cd<=0){e.dive=60;e.cd=EV.fCd;}}
        else{e.dive--;var ty=e.dive>30?p.y:e.base;e.y+=(ty-e.y)*.07;e.x+=(dx>0?1:-1)*.5;
          if(EV.fShot&&e.dive===26&&onS){var fv=aimAt(e.x+5,e.y+3,1.5);eshot(e.x+5,e.y+3,fv[0],fv[1],{c:'#ff8aa6'});}}

            if(EV.tFan){var a0=Math.atan2(v[1],v[0]);[-.32,.32].forEach(function(o){eshot(e.x+5,e.y+3,Math.cos(a0+o)*1.5,Math.sin(a0+o)*1.5,{c:'#ff8a2a'});});}

/* ===================== capa de sprites de imagen =========================
   ART es el banco de hojas. Cada entrada dice el tamano de un fotograma en
   pixeles LOGICOS y trae la imagen a SC veces ese tamano, o sea 1:1 con el
   lienzo: ni se estira ni se reduce. El bloque de datos lo escribe
   inline_art.py entre las marcas <ART> y </ART>.
   Regla del encargo: si una hoja falta o no carga, el juego sigue dibujando
   con spr() y rect() igual que antes. Ninguna funcion de dibujo se borra. */
/* <ART> */
var ART=window.DSA||{};
/* </ART> */
var SHEET={};
function loadArt(){
  for(var k in ART)(function(k,d){
    var o={fw:d.fw,fh:d.fh,n:d.n||1,x1:d.x1||0,ok:false,img:null,wimg:null};SHEET[k]=o;
    var im=new Image();
    im.onload=function(){
      o.img=im;o.ok=true;
      // Copia blanca precalculada para el destello al recibir dano.
      var cn=document.createElement('canvas');cn.width=im.width;cn.height=im.height;
      var q=cn.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(im,0,0);
      q.globalCompositeOperation='source-in';q.fillStyle='#fff';q.fillRect(0,0,cn.width,cn.height);
      o.wimg=cn;
    };
    im.onerror=function(){o.ok=false;};
    im.src=d.src;
  })(k,ART[k]);
}
// Pinta el fotograma f de la hoja k sobre la caja logica (x,y,w,h): centrado en
// X y apoyado abajo. Devuelve false si la hoja no esta lista, y entonces el
// motor sigue con su dibujo por codigo.
// Igual que blit pero a escala entera s (x,y = esquina de arriba a la izquierda):
// cada pixel del sprite sale de s x s, sigue siendo cuadrado. Las hojas x1
// (retratos e ilustraciones) vienen a 1x en vez de a SC.
function blitS(k,f,x,y,s,flip,white){
  var o=SHEET[k];if(!o||!o.ok)return false;
  var m=o.x1?1:SC,src=white?(o.wimg||o.img):o.img,sw=o.fw*m,sh=o.fh*m,sx=(((f|0)%o.n)+o.n)%o.n*sw,dw=o.fw*s,dh=o.fh*s,dx=Math.round(x),dy=Math.round(y);
  if(flip){g.save();g.translate(dx+dw,dy);g.scale(-1,1);g.drawImage(src,sx,0,sw,sh,0,0,dw,dh);g.restore();}
  else g.drawImage(src,sx,0,sw,sh,dx,dy,dw,dh);
  return true;
}

function tintSheet(k){var o=SHEET[k],key=k+'r';if(!o||!o.ok)return k;if(SHEET[key])return key;
  var c=document.createElement('canvas');c.width=o.img.width;c.height=o.img.height;var q=c.getContext('2d');q.drawImage(o.img,0,0);
  q.globalCompositeOperation='source-atop';q.fillStyle='rgba(255,40,90,.38)';q.fillRect(0,0,c.width,c.height);
  SHEET[key]={fw:o.fw,fh:o.fh,n:o.n,x1:o.x1,ok:true,img:c,wimg:o.wimg};return key;}
function blit(k,f,x,y,w,h,flip,white,alpha){
  var o=SHEET[k];if(!o||!o.ok)return false;
  var src=white?(o.wimg||o.img):o.img,m=o.x1?1:SC;
  var sw=o.fw*m,sh=o.fh*m,sx=(((f|0)%o.n)+o.n)%o.n*sw;
  var dx=Math.round(x+(w-o.fw)/2),dy=Math.round(y+h-o.fh);

  if(flip){g.save();g.translate(dx+o.fw,dy);g.scale(-1,1);g.drawImage(src,sx,0,sw,sh,0,0,o.fw,o.fh);g.restore();}
  else g.drawImage(src,sx,0,sw,sh,dx,dy,o.fw,o.fh);

var TSPR={};
function shade(c,f){
  var n=parseInt(c.slice(1),16),r=n>>16&255,gg=n>>8&255,b=n&255;
  function m(v){v=Math.round(v*f);return v<0?0:v>255?255:v;}
  return 'rgb('+m(r)+','+m(gg)+','+m(b)+')';
}
// Lienzo cacheado por clave. paint(q,D) dibuja en pixeles de sprite (D=48).
function tileSpr(key,paint){
  var o=TSPR[key];if(o)return o;
  var cn=document.createElement('canvas');cn.width=T*SC;cn.height=T*SC;
  var q=cn.getContext('2d');q.imageSmoothingEnabled=false;paint(q,T*SC);
  TSPR[key]=cn;return cn;
}
function qp(q,x,y,w,h,c){q.fillStyle=c;q.fillRect(x,y,w,h);}
// Bloque de suelo: sillares con junta, grano y luz de arriba-izquierda.
function paintGnd(q,D,S,v,top){
  var x,y,i;
  qp(q,0,0,D,D,S.gnd);
  var CH=12,BW=24;                       // curso de 12 px, sillar de 24
  for(var cr=0;cr<D/CH;cr++){
    var oy=cr*CH,offx=((cr+v)%2)*BW/2;
    for(i=-1;i<D/BW+1;i++){
      var bx=Math.round(i*BW+offx),s=rnd(cr*7+i*13+v*31);
      qp(q,bx,oy,BW-1,CH-1,shade(S.gnd,.93+s*.16));         // tono del sillar
      qp(q,bx,oy,BW-1,1,shade(S.gnd,1.22));                 // luz arriba
      qp(q,bx,oy,1,CH-1,shade(S.gnd,1.12));                 // luz izquierda
      qp(q,bx,oy+CH-2,BW-1,1,shade(S.gnd,.74));             // sombra abajo
      qp(q,bx+BW-2,oy+1,1,CH-3,shade(S.gnd,.8));            // sombra derecha
    }
    qp(q,0,oy+CH-1,D,1,shade(S.gnd,.58));                   // junta
  }
  // Grano: motas de 1 px, deterministas, para que la piedra no sea plana.
  for(y=0;y<D;y++)for(x=0;x<D;x++){
    var r=rnd(x*3.7+y*11.3+v*53);
    if(r>.955)qp(q,x,y,1,1,shade(S.gnd,1.16));
    else if(r<.045)qp(q,x,y,1,1,shade(S.gnd,.84));
  }
  // Grieta en dos de las cuatro variantes.
  if(v>1){var gx=10+((rnd(v*17)*20)|0),gy=6;
    for(i=0;i<16;i++){qp(q,gx,gy+i,1,1,shade(S.gnd,.62));if(rnd(i+v)>.6)gx+=rnd(i*3+v)>.5?1:-1;}}
  if(top){
    // Remate: franja de S.top con brillo arriba, linea oscura y goteo irregular.
    qp(q,0,0,D,10,S.top);
    qp(q,0,0,D,2,shade(S.top,1.3));
    qp(q,0,8,D,2,S.tex);
    for(x=0;x<D;x++){var d=(rnd(x*5.1+v*29)*7)|0;if(d>3)qp(q,x,10,1,d-3,S.tex);}
    for(i=0;i<D;i+=1)if(rnd(i*2.3+v*7)>.9)qp(q,i,3+((rnd(i+v)*4)|0),1,1,shade(S.top,.78));
  }
}
// Plataforma fina: tablon con cantos, tornillos y sombra debajo.
function paintPlat(q,D,S){
  qp(q,0,0,D,12,S.top);
  qp(q,0,0,D,2,shade(S.top,1.32));
  qp(q,0,10,D,2,shade(S.top,.68));
  for(var x=0;x<D;x++){var r=rnd(x*4.3);if(r>.86)qp(q,x,3+((r*5)|0),1,1,shade(S.top,.82));}
  qp(q,0,12,D,3,'rgba(0,0,0,.45)');
  qp(q,2,12,2,5,S.tex);qp(q,D-4,12,2,5,S.tex);
  qp(q,5,4,2,2,shade(S.top,.6));qp(q,D-7,4,2,2,shade(S.top,.6));   // tornillos
}
// Pinchos: metal con tres tonos duros y punta roja.
function paintSpikes(q,D){
  for(var k=0;k<3;k++){
    var bx=k*16,h=24;
    for(var r=0;r<h;r++){
      var w=Math.max(1,Math.round((h-r)/h*14)),sx=bx+8-(w>>1),yy=D-1-r;
      qp(q,sx,yy,w,1,'#9aa2b8');
      qp(q,sx,yy,Math.max(1,w>>1),1,'#d8dcea');
      if(w>3)qp(q,sx+w-1,yy,1,1,'#6a7088');
    }
    qp(q,bx+7,D-h,2,3,'#ff3d6e');
    qp(q,bx+7,D-h,2,1,'#ffb0c4');
  }
}
function drawTiles(){
  var S=STAGES[st.n],c0=Math.floor(cam/T),c1=c0+Math.ceil(W/T)+1,n=st.n;
  for(var cy=0;cy<ROWS;cy++)for(var cx=c0;cx<=c1;cx++){
    var tt=tileAt(cx,cy);if(!tt||cx<0||cx>=COLS)continue;
    var x=Math.round(cx*T-cam),y=cy*T;
    if(tt===1){
      var top=tileAt(cx,cy-1)!==1,v=(rnd(cx*3+cy*7)*4)|0;
      g.drawImage(tileSpr('g'+n+v+(top?'t':''),function(q,D){paintGnd(q,D,S,v,top);}),x,y,T,T);
      if(n===2&&cy===13&&top)rect(x,y+5,T,1,'#5a5f6a');
    }
    else if(tt===2)g.drawImage(tileSpr('p'+n,function(q,D){paintPlat(q,D,S);}),x,y,T,T);
    else if(tt===3)g.drawImage(tileSpr('s',paintSpikes),x,y,T,T);
    else if(tt===4){var ph=(t>>1)+cy*5;rect(x+2,y,8,T,'rgba(255,61,110,.16)');
      for(var q=0;q<2;q++){var yy=y+((ph+q*6)%T);rect(x+3,yy,6,3,'#ff3d6e');rect(x+5,yy+1,2,1,'#fff');}
      light(x+6,y+6,10,.35,'#ff3d6e');}
  }
  mplats.forEach(function(m){var x=Math.round(m.x-cam);
    if(m.v){g.globalAlpha=.35;rect(x+m.w/2-1,m.y0-m.rg,2,m.rg+6,'#3de8ff');g.globalAlpha=1;}rect(x,m.y,m.w,4,'#3de8ff');rect(x,m.y+4,m.w,1,'#1a6a7a');rect(x+2,m.y+1,m.w-4,1,'#c8f8ff');});
  st.cps.forEach(function(c){var x=Math.round(c.x-cam)+4;rect(x,c.y-12,2,28,'#9aa0b0');
    if(c.on){rect(x+2,c.y-12,10,2,'#2bb34a');rect(x+2,c.y-10,10,2,'#ffd23f');rect(x+2,c.y-8,10,2,'#ff3d6e');}else rect(x+2,c.y-12,10,6,'#555a70');});
}
// Hoja de imagen por tipo de enemigo (capa de sprites; si falta, se dibuja por codigo).
var ESHEET={w:'e_w',h:'e_h',f:'e_f',t:'e_t',s:'e_s',b:'e_b','*':'e_box'};
function drawEnemy(e){
  var x=e.x-cam,y=e.y,f=e.dir>0,wh=e.fl>0;
  var ed=EDEF[e.type];
  if(e.type==='X'){x=Math.round(x);y=Math.round(y);shadow(x,e.x,e.y,10,12);
    var o=wh?'#fff':'#1a1530';rect(x+1,y,8,12,o);rect(x,y+1,10,10,o);
    rect(x+1,y+1,8,10,wh?'#fff':'#c8203e');rect(x+1,y+1,2,10,wh?'#fff':'#ff5a6e');rect(x+7,y+1,2,10,wh?'#fff':'#8a1028');
    rect(x+1,y+3,8,1,'#1a1530');rect(x+1,y+8,8,1,'#1a1530');
    rect(x+3,y+4,4,4,'#ffd23f');rect(x+4,y+5,2,1,'#1a1530');rect(x+4,y+6,1,1,'#1a1530');
    if((t>>4)&1)light(x+5,y+5,12,.5,'#ff3d6e');return;}
  if(ed)shadow(x,e.x,e.y,ed.w,ed.h);
  if(ed&&blit(ESHEET[e.type],e.a|0,x,y,ed.w,ed.h,e.type==='f'?p.x<e.x:f,wh)){
    if(e.type==='t'){
      var tv=aimAt(e.x+5,e.y+3,1);for(var tk=0;tk<5;tk++)rect(x+5+tv[0]*tk,y+3+tv[1]*tk,1,1,'#ff8a2a');
      if(e.cd<20&&(t>>2)&1)rect(x+4,y+2,2,2,'#ff3d6e');
    }
    return;
  }
  switch(e.type){
    case 'w':spr(WB.concat([WL[(e.a|0)%2]]),WALK,x,y,f,wh);break;
    case 'h':spr(WB.concat([WL[e.ground?0:1],'..........']),HOP,x,y-(e.ground?0:1),f,wh);break;
    case 'f':spr([FR[(e.a|0)%2]].concat(FB),FP,x,y,p.x<e.x,wh);break;
    case 't':
      rect(x,y+4,10,6,wh?'#fff':'#4a5170');rect(x+1,y+5,8,1,'#7a82a8');rect(x+2,y+1,6,4,wh?'#fff':'#2a2e48');
      var v=aimAt(e.x+5,e.y+3,1);for(var k=0;k<5;k++)rect(x+5+v[0]*k,y+3+v[1]*k,1,1,'#ff8a2a');
      if(e.cd<20&&(t>>2)&1)rect(x+4,y+2,2,2,'#ff3d6e');break;
    case 's':
      rect(x+2,y,7,4,wh?'#fff':'#2a2e48');rect(x+3,y+1,5,2,'#3de8ff');rect(x+2,y+4,7,7,wh?'#fff':'#3a3f60');rect(x+2,y+11,2,2,'#15151c');rect(x+7,y+11,2,2,'#15151c');
      var sx=e.dir>0?x+9:x;rect(sx,y+1,2,12,'#9aa0b0');rect(sx+(e.dir>0?1:0),y+2,1,10,'#d8dce8');break;
    case 'b':
      rect(x+1,y+1,12,5,wh?'#fff':'#2bb37a');rect(x,y+2,14,3,wh?'#fff':'#2bb37a');rect(x+3,y+6,8,2,'#1b7a55');rect(x+2,y+2,10,1,'#7ae0a8');
      rect(x+(e.x>p.x?13:-2),y+((t>>1)&1?1:4),2,2,'#9aa0b0');break;
    case '*':
      rect(x,y,10,10,wh?'#fff':'#8a5a2a');rect(x+1,y+1,8,8,'#b07838');rect(x,y+4,10,1,'#6a4018');
      txt('?',x+1,y+1,'#ffd23f');break;
  }
}
function drawBoss(b){
  if(!b.dead){shadow(b.x-cam,b.x,b.y,b.w,b.h);
    light(b.x-cam+b.w/2,b.y+b.h/2,Math.max(16,b.w),b.fl>0?1:.55,b.ph>1?'#ff3d6e':'#ff8aa6');}
  var x=Math.round(b.x-cam),y=Math.round(b.y),wh=b.fl>0||(b.act&&b.actT>0&&b.actT<40&&(b.actT>>2)&1&&b.act!=='burst'&&b.act!=='low'&&b.act!=='ground');
  function R(a,c,w,h,col){g.fillStyle=wh?'#fff':col;g.fillRect(x+a,y+c,w,h);}
  if(b.ph>1&&!b.dead){g.globalAlpha=.16+.06*((t>>3)&1);rect(x-4,y-4,b.w+8,b.h+8,'#ff3d6e');g.globalAlpha=1;}
  var s=(b.a|0)%2;
  // Capa de sprites del jefe. Si la hoja falta se dibuja por codigo como siempre;
  // los avisos de ataque de mas abajo se pintan en los dos casos.
  var bok;
  if(b.kind===4){var sk=ESHEET[b.mt],so=SHEET[sk];bok=!!(so&&so.ok);
    if(bok){var fw=so.fw*b.sc,fh=so.fh*b.sc;blitS(sk,b.a|0,x+b.w/2-fw/2,y+b.h-fh+Math.round((fh-b.h)*.4),b.sc,b.mt==='f'?p.x<b.x:b.dir>0,wh);
      if(b.mt==='s'&&b.act!=='stun'){var sx2=b.dir>0?x+b.w-2:x-2;rect(sx2,y+4,4,b.h-6,wh?'#fff':'#9aa0b0');rect(sx2+1,y+5,2,b.h-8,'#d8dce8');}}}
  else bok=blit(b.mk?tintSheet('b_'+b.kind):'b_'+b.kind,b.a|0,x,y,b.w,b.h,b.vx<0,wh);
  if(!bok){
  if(b.kind===4){R(0,0,b.w,b.h,'#3a3f60');R(2,2,b.w-4,4,'#ff3d6e');}
  else if(b.kind===0){
    R(0,0,24,24,'#22263a');R(1,1,22,1,'#4a5170');R(1,1,1,22,'#4a5170');R(4,4,16,16,'#0b0c14');R(6,6,12,12,'#2c3048');R(9,9,6,6,'#0b0c14');
    for(var k=0;k<12;k++){R(6+k,6+k,1,1,'#ff3d6e');R(17-k,6+k,1,1,'#ff3d6e');}
    R(3,2,3,1,b.ph>1?'#ff3d6e':'#3de8ff');R(18,2,3,1,b.ph>1?'#ff3d6e':'#3de8ff');
    R(4,24,5,6-s,'#4a5170');R(15,24,5,5+s,'#4a5170');R(3,29-s,7,1,'#9aa0b0');R(14,28+s,7,1,'#9aa0b0');
  }else if(b.kind===1){
    R(4,4,20,8,'#3a3f60');R(2,6,24,5,'#3a3f60');R(6,5,16,1,'#6a7090');R(10,7,8,4,'#0b0c14');R(12,8,4,2,b.ph>1?'#ff3d6e':'#3de8ff');
    R(0,s?0:1,10,2,'#9aa0b0');R(18,s?1:0,10,2,'#9aa0b0');R(4,2,2,3,'#22263a');R(22,2,2,3,'#22263a');
    R(8,12,2,4,'#22263a');R(18,12,2,4,'#22263a');R(12,12,4,3,'#ffd23f');
    if(b.act==='ground')R(6,0,16,2,'#ffd23f');
  }else if(b.kind===2){
    R(0,2,24,14,'#2a2d38');R(1,3,22,1,'#5a5f6a');R(3,5,8,6,'#0b0c14');R(13,5,8,6,'#0b0c14');R(5,7,4,2,'#ffd23f');R(15,7,4,2,'#ffd23f');
    R(0,13,24,3,'#ff3d6e');R(10,0,4,3,'#9aa0b0');R(2,16,4,2,'#15151c');R(18,16,4,2,'#15151c');
    if(b.act!=='low'){g.globalAlpha=.3;rect(x+2,y-4,20,2,'#3de8ff');g.globalAlpha=1;}
  }else{
    R(3,0,20,10,'#e8e2d0');R(5,3,6,3,'#0b0c14');R(15,3,6,3,'#0b0c14');R(6,4,2,1,'#ff3d6e');R(16,4,2,1,'#ff3d6e');R(8,7,10,2,'#0b0c14');
    R(0,10,26,16,'#1a1024');R(2,12,22,12,'#2e1a40');R(10,14,6,6,'#0b0c14');R(12,16,2,2,b.ph>2?'#ff3d6e':'#ffd23f');
    R(0,10,3,12,'#e8e2d0');R(23,10,3,12,'#e8e2d0');R(-3,20+s,4,4,'#e8e2d0');R(25,20-s,4,4,'#e8e2d0');
    R(5,26,6,8,'#1a1024');R(15,26,6,8,'#1a1024');R(4,33,8,1,'#ff3d6e');R(14,33,8,1,'#ff3d6e');
    for(var j=0;j<b.ph;j++)R(7+j*5,-4,3,3,'#ff3d6e');
  }
  }
  if(b.kind===4&&b.act==='tele'&&b.next==='charge'){g.globalAlpha=.3;rect(b.dir>0?x+b.w:st.arenaX-cam,y+b.h-10,b.dir>0?st.arenaX+W-b.x-b.w:b.x-st.arenaX,6,'#ff3d6e');g.globalAlpha=1;}
  if(b.kind===4&&b.act==='aim'){g.globalAlpha=.25+.15*((t>>2)&1);rect(Math.round(b.tx-cam)+4,y+b.h,b.w-8,GY-y-b.h,'#ff3d6e');g.globalAlpha=1;}
  if(b.kind===4&&b.act==='stun'&&(t>>3)&1)txt('!',x+b.w/2-3,y-12,'#ffd23f');
  if(b.kind===0&&b.act==='wave'&&b.actT>0)rect(x-8,GY-1,b.w+16,1,'#ffd23f');
  if(b.kind===0&&b.act==='dash'&&b.actT>0){g.globalAlpha=.3;var right=p.x>b.x;rect(right?x+b.w:st.arenaX-cam,y+10,right?st.arenaX+W-b.x-b.w:b.x-st.arenaX,6,'#ff3d6e');g.globalAlpha=1;}
  if(b.kind===1&&b.act==='aim'){g.globalAlpha=.25+.15*((t>>2)&1);rect(Math.round(b.tx-cam)+4,y+b.h,20,GY-y-b.h,'#ff3d6e');g.globalAlpha=1;}
  if(b.kind===3&&b.act==='wave'&&b.actT>0)rect(x-8,GY-1,b.w+16,1,'#ffd23f');
}

function drawPlayer(){
  ghosts.forEach(function(gh){spr(PB.concat(PL.air),PP,gh.x-2-cam,gh.y,gh.f<0,true,gh.l/30);});
  if(p.dead)return;if(p.inv>0&&!p.dash&&(p.inv>>2)&1)return;
  var legs=p.ground?(p.vx?[PL.r1,PL.st,PL.r2,PL.st][(p.anim|0)%4]:PL.st):PL.air;
  var x=p.x-2-cam,y=p.y-0;
  shadow(p.x-cam,p.x,p.y,p.w,p.h);
  // Brillo corto alrededor del heroe (solo presencia: la escena ya se ve).
  light(p.x-cam+p.w/2,p.y+p.h/2,p.dash?30:20,.8,'#9fd2ff');
  // Capa de sprites: estado -> hoja. Si la hoja no esta lista se cae a la hoja de
  // reposo y, si tampoco, al dibujo por codigo de siempre.
  var pst=p.dash?'dash':(!p.ground?(p.vy<0?'jump':'fall'):(p.aimU?'aimu':(p.vx?'run':'idle')));
  if(!blit(lookSheet(pst),p.anim|0,p.x-cam,p.y,p.w,p.h,p.face<0,false)&&
     !blit('p_idle',p.anim|0,p.x-cam,p.y,p.w,p.h,p.face<0,false))
    spr((p.aimU?PBU:PB).concat(legs),PP,x,y,p.face<0,false);
  if(p.aimU){var gx=Math.round(x)+(p.face>0?8:3);rect(gx,y+3,1,4,'#c8ccd8');}
  if(p.mf>0){var mx,my;if(p.aimU&&!K.ArrowLeft&&!K.ArrowRight&&!TS.L&&!TS.R){mx=Math.round(x)+(p.face>0?7:2);my=Math.round(y)-1;}else{mx=Math.round(x)+(p.face>0?12:-4);my=Math.round(y)+6;}
    rect(mx,my,4,3,WPN[run.wpn].c);rect(mx+1,my+1,2,1,'#fff');light(mx+2,my+1,18,1,WPN[run.wpn].c);}
}
// Heroe de la portada: corre en el sitio mientras el barrio pasa por detras,
// con su sombra de contacto y el fogonazo del disparo. Son los sprites de verdad.
function drawTitleHero(){
  var hx=Math.round(W*.13),hy=GY-p.h,fr=(t/7)|0;
  shadow(hx,hx+cam,hy,p.w,p.h);
  light(hx+p.w/2,hy+p.h/2,28,.9,'#3de8ff');
  if(!blit(lookSheet('run'),fr,hx,hy,p.w,p.h,false,false))
    blit('p_idle',fr,hx,hy,p.w,p.h,false,false);
  if((t%150)<10){var mx=hx+p.w+1,my=hy+6;
    rect(mx,my,4,3,'#ffd23f');rect(mx+1,my+1,2,1,'#fff');light(mx+2,my+1,20,1,'#ffd23f');}
}
function heart(x,y,full,c){var col=full?(c||'#ff3d6e'):'#3a2030';rect(x+1,y,2,1,col);rect(x+4,y,2,1,col);rect(x,y+1,7,2,col);rect(x+1,y+3,5,1,col);rect(x+2,y+4,3,1,col);rect(x+3,y+5,1,1,col);}
function drawHUD(){
  var gr=g.createLinearGradient(0,0,0,30);gr.addColorStop(0,'rgba(6,7,13,.85)');gr.addColorStop(1,'rgba(6,7,13,0)');g.fillStyle=gr;g.fillRect(0,0,HW,30);
  for(var i=0;i<run.maxHp;i++)heart(5+i*9,4,i<p.hp);
  txt('x'+Math.max(0,run.lives),5,13,'#eef3ff');
  var wc=WPN[run.wpn].c;rect(29,12,10,10,wc);txt(run.wpn,30,13,'#06070d');
  for(i=0;i<3;i++)rect(41,13+i*3,3,2,run.lv>=3-i?wc:'#2a2e48');
  var bx=50,full=run.bass>=100;rect(bx,14,46,6,'#06070d');rect(bx+1,15,44,4,'#2a1a10');
  rect(bx+1,15,Math.round(44*run.bass/100),4,full?((t>>3)&1?'#fff':'#ffd23f'):'#c08a20');
  rect(bx+48,15,4,4,p.dashCd>0?'#1d3a2a':'#4dff88');
  if(full&&!(t&32))txt(touchMode()?'¡BASS!':'V: BASS',bx+56,13,'#ffd23f');
  var HR=HW-5-HUDR;txt(pad(run.score,7),HR,4,'#ffd23f','r');
  // El titulo de arriba vive en el hueco libre entre los corazones y el marcador.
  g.font='8px "Press Start 2P", monospace';
  var thx=5+run.maxHp*9,tsx=HR-g.measureText(pad(run.score,7)).width,tcx=(thx+tsx)/2,tgap=tsx-thx-6;
  var cw=g.measureText(''+run.coins).width;rect(HR-7-cw,13,6,6,'#ffd23f');rect(HR-5-cw,15,2,2,'#06070d');txt(''+run.coins,HR,13,'#ffd23f','r');
  if(boss&&boss.on){var bw=Math.min(120,HW-48),bxx=HW/2-bw/2,bn=st.L.boss;
    while(bn.length>3&&g.measureText(bn).width>tgap)bn=bn.slice(0,-1);
    txt(bn,tcx,4,boss.ph>1?'#ff8aa6':'#eef3ff','c');
    rect(bxx-1,14,bw+2,7,'#000');rect(bxx,15,bw,5,'#3a0a18');rect(bxx,15,Math.max(0,Math.round(bw*boss.hp/boss.max)),5,boss.fl>0?'#fff':'#ff3d6e');
    if(boss.kind===3){rect(bxx+bw*.33,15,1,5,'#000');rect(bxx+bw*.66,15,1,5,'#000');}else rect(bxx+bw*(boss.mk?.75:.5),15,1,5,'#000');
    if(run.mult>1)txt('x'+run.mult,bxx+bw+6,13,'#3de8ff');}
  else{var lb='FASE '+(st.i+1)+' '+st.L.name;
    // Con la ventana estrecha el titulo de fase chocaba con el marcador: forma corta.
    if(g.measureText(lb).width>tgap)lb='F'+(st.i+1)+' '+st.L.name;
    if(g.measureText(lb).width>tgap)lb=st.L.name;
    if(g.measureText(lb).width>tgap)lb='FASE '+(st.i+1);
    txt(lb,tcx,4,'#8f98c8','c');if(run.mult>1)txt('COMBO x'+run.mult,HW/2,13,'#3de8ff','c');}
  if(st.i===0&&!SET.tut&&!st.lock&&st.t>150){var tips=touchMode()?
      ['ARRASTRA EN LA IZQUIERDA PARA MOVERTE','TOCA SALTO DOS VECES = DOBLE SALTO',autoFire()?'DISPARA SOLO AL VER ENEMIGOS':'MANTÉN FUEGO PARA DISPARAR','MANTÉN SALTO: DASH, ATRAVIESA BALAS','BARRA LLENA: PULSA BASS']:
      ['FLECHAS: MOVERTE','Z / ESPACIO: SALTO (DOBLE EN EL AIRE)','X: DISPARO (MANTÉN PULSADO)','C: DASH, ESQUIVA LAS BALAS','V: BASS DROP CON LA BARRA LLENA'];
    var k=Math.floor((st.t-150)/260);if(k<tips.length){var lt=(st.t-150)%260;g.globalAlpha=lt<20?lt/20:lt>240?(260-lt)/20:1;
      // El consejo se parte en dos lineas si no cabe de ancho.
      var ln=wrap(tips[k],HW-24),tw=0,q;for(q=0;q<ln.length;q++)tw=Math.max(tw,g.measureText(ln[q]).width);
      var ty=banner?58:32;rect(HW/2-tw/2-6,ty,tw+12,6+9*ln.length,'rgba(6,7,13,.75)');
      for(q=0;q<ln.length;q++)txt(ln[q],HW/2,ty+3+q*9,'#eef3ff','c');g.globalAlpha=1;}}
}
function draw(){
  g.save();g.setTransform(SC,0,0,SC,0,-Math.round(camY)*SC);
  if(sh>0)g.translate((Math.random()*4-2)|0,(Math.random()*4-2)|0);
  if(!st){rect(0,camY,W,H,'#06070d');g.restore();return;}
  drawBG();drawTiles();
  pickups.forEach(function(k){var x=Math.round(k.x-cam),y=Math.round(k.y+(k.stat?Math.sin(t*.08+k.x)*1.5:0));if(k.l>0&&k.l<100&&(k.l>>3)&1)return;
    // Capa de sprites del objeto; si la hoja falta se dibuja por codigo como siempre.
    shadow(x,k.x,k.y,k.w,k.h);
    light(x+k.w/2,y+k.h/2,k.type==='coin'?10:14,.75,k.type==='coin'?'#ffd23f':k.type==='hp'?'#ff3d6e':WPN[k.wt].c);
    if(blit(k.type==='coin'?'i_coin':k.type==='hp'?'i_hp':'i_'+k.wt,t>>3,x,y,k.w,k.h,false,false))return;
    if(k.type==='coin'){var w=[8,6,2,6][(t>>3)%4];rect(x+4-w/2,y,w,8,'#15151c');if(w>2){rect(x+4-w/2+1,y+1,w-2,6,'#2a2a34');rect(x+3,y+3,2,2,'#ffd23f');}}
    else if(k.type==='hp')heart(x,y+1,1);
    else{var c=WPN[k.wt].c;rect(x,y,10,10,c);rect(x+1,y+1,8,8,'#06070d');txt(k.wt,x+1,y+1,c);}});
  enemies.forEach(function(e){if(!e.dead&&e.x>cam-20&&e.x<cam+W+20)drawEnemy(e);});
  if(boss)drawBoss(boss);
  drawHazards();drawBooms();
  if(mode!=='menu')drawPlayer();else drawTitleHero();
  bullets.forEach(function(b){var x=Math.round(b.x-cam),y=Math.round(b.y),c=WPN[b.w].c;
    if(b.w==='L'){g.strokeStyle=c;g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x-b.vx*1.6,y-b.vy*1.6);g.stroke();rect(x-1,y-1,2,2,'#fff');}
    else if(b.w==='H'){rect(x-1,y-2,3,3,c);rect(x+1,y-5,1,4,c);}
    else{rect(x-2,y-1,4,3,c);rect(x-1,y,2,1,'#fff');}
    light(x,y,b.w==='L'?14:10,.6,c);});
  ebul.forEach(function(q){var x=Math.round(q.x-cam),y=Math.round(q.y),r=q.r;rect(x-r,y-r+1,r*2,r*2-2,q.c);rect(x-r+1,y-r,r*2-2,r*2,q.c);rect(x-1,y-1,2,2,'#fff');
    light(x,y,8+r*2,.55,q.c);});
  parts.forEach(function(a){rect(a.x-cam,a.y,a.l>8?2:1,a.l>8?2:1,a.c);});
  if(ring){g.strokeStyle='#ffd23f';g.lineWidth=4;g.globalAlpha=Math.max(0,1-ring.r/360);g.beginPath();g.arc(ring.x-cam,ring.y,ring.r,0,6.283);g.stroke();
    g.strokeStyle='#4dff88';g.lineWidth=2;g.beginPath();g.arc(ring.x-cam,ring.y,ring.r*.8,0,6.283);g.stroke();g.globalAlpha=1;
    light(ring.x-cam,ring.y,Math.min(72,20+ring.r*.5),Math.max(0,1-ring.r/360),'#ffd23f');}
  pops.forEach(function(o){txt(o.s,o.x-cam,o.y,o.c);});
  g.restore();
  drawLight();
  if(mode==='menu')return;
  // La escena usa la misma escala que el HUD (tamano de interfaz): texto, rotulos y busto.
  if(mode==='cut'){var hc=HS;cutQ();HS=HS*UIF;HW=Math.round(W/HS);HH=Math.round(H/HS);
    try{drawCut();}finally{HS=hc;HW=Math.round(W/HS);HH=Math.round(H/HS);}return;}
  // El HUD, el cartel y el destello van en su propia capa escalada: asi quedan
  // fuera del temblor de camara, igual que antes de pasar a lienzo x4.
  // Escala propia del HUD (tamano de interfaz): se cambia HS el rato que se pinta.
  var hs0=HS;HS=HS*UIF;HW=Math.round(W/HS);HH=Math.round(H/HS);
  g.save();try{g.setTransform(SC*HS,0,0,SC*HS,0,0);
  drawHUD();
  if(banner){g.globalAlpha=banner.l<20?banner.l/20:Math.min(1,(170-banner.l)/10+.2);
    // El cartel vive en la franja de arriba, justo bajo el marcador: nunca tapa la accion.
    var bl=wrap(banner.b,HW-16),by=banner.a?33:24,bq;
    rect(0,22,HW,(banner.a?13:4)+9*bl.length,'rgba(6,7,13,.72)');
    if(banner.a)txt(banner.a,HW/2,24,banner.boss?'#ff3d6e':'#3de8ff','c');
    for(bq=0;bq<bl.length;bq++)txt(bl[bq],HW/2,by+bq*9,'#ffd23f','c');g.globalAlpha=1;}
  if(flash>0){g.globalAlpha=flash/24;rect(0,0,HW,HH,flashC);g.globalAlpha=1;}
  if(p.dead&&run.lives>0&&p.deadT<60)txt('VIDAS: '+run.lives,HW/2,HH*.55,'#eef3ff','c');
  }finally{g.restore();HS=hs0;HW=Math.round(W/HS);HH=Math.round(H/HS);}
}
loadArt();
// Con escala entera el pixelado es siempre lo correcto. Solo en la ventana
// enana donde ni z=1 cabe se deja que el navegador interpole, para que el
// recorte no salga a dentelladas.
function fitPx(){var r=vrect(cv),dp=window.devicePixelRatio||1;
  cv.style.imageRendering=(r.width*dp>=cv.width-1)?'pixelated':'auto';}
addEventListener('resize',function(){fitW();fitPx();placePad();titleTop();});
addEventListener('orientationchange',function(){setTimeout(function(){fitW();fitPx();placePad();},120);});
fitW();fitPx();
var last=0,acc=0;
function frame(ts){acc+=Math.min(ts-last,100);last=ts;while(acc>=16.67){update();acc-=16.67;}draw();requestAnimationFrame(frame);}
showMenu();
requestAnimationFrame(function(ts){last=ts;frame(ts);});

if(DEBUG)window.DS={
  sheets:SHEET,
  ev:function(c){return eval(c);},
  get s(){return {mode:mode,stage:st&&st.i,score:run&&run.score,lives:run&&run.lives,hp:p&&p.hp,x:p&&Math.round(p.x),y:p&&Math.round(p.y),dead:p&&p.dead,
    boss:!!boss,bossOn:!!(boss&&boss.on),bossHp:boss?Math.round(boss.hp):0,bossMax:boss?Math.round(boss.max):0,ph:boss?boss.ph:0,enemies:enemies?enemies.length:0,
    coins:run&&run.coins,wpn:run&&run.wpn,lv:run&&run.lv,bass:run&&run.bass,arenaX:st&&st.arenaX,cols:COLS,kills:run&&run.stats.kills,lock:st&&st.lock};},
  god:function(v){window.__god=v!==false;},
  toArena:function(){p.x=st.arenaX+10;p.y=GY-p.h-30;p.vy=0;cam=st.arenaX-40;},
  hitBoss:function(n){damageBoss(n);},
  coins:function(n){run.coins+=n;},bass:function(){run.bass=100;},
  warp:function(n,c){CUR=null;enterLevel(n,!!c);},cutAdv:function(){cutAdv();},cutSkip:function(){cutSkip();},
  act:act,
  setDiff:function(d){SET.diff=d;D=DIFFS[d];},
  tile:function(x,y){return tileAt(x,y);},
  mp:function(){return mplats.map(function(m){return {x:Math.round(m.x),y:m.y,w:m.w};});},place:function(x,y){p.x=x;p.y=y;p.vx=0;p.vy=0;},
  sense:function(){var fx=p.x+p.w+14,pit=tileAt(Math.floor(fx/T),13)===0,
    spike=tileAt(Math.floor((p.x+p.w+10)/T),12)===3||tileAt(Math.floor((p.x+p.w+22)/T),12)===3,wall=tileAt(Math.floor((p.x+p.w+6)/T),Math.floor((p.y+8)/T))===1,
    en=enemies.some(function(e){return !e.dead&&e.type!=='t'&&e.x-p.x>-6&&e.x-p.x<34&&Math.abs(e.y-p.y)<24;}),
    eb=ebul.some(function(q){return Math.abs(q.x-p.x)<40&&Math.abs(q.y-(p.y+7))<14;});
    var mn=mplats.filter(function(m){return m.x+m.w-p.x>-10&&m.x-p.x<230;})[0];return {mpNear:!!mn,mpReady:!!mn&&mn.x-(p.x+p.w)<6&&mn.x+mn.w>p.x+p.w+10,onMp:!!p.onMp,pit:pit,spike:spike,wall:wall,en:en,eb:eb,g:p.ground,boss:!!(boss&&boss.on),bx:boss?boss.x-p.x:0,lock:st.lock,train:trains.length>0||(boss&&boss.act==='train'),laser:hazards.some(function(h){return h.k==='laser';}),wave:hazards.some(function(h){return h.k==='wave'&&Math.abs(h.x-p.x)<40;})};}
};
})();
