:root{color-scheme:dark;--bg:#06070d;--ink:#eef3ff;--dim:#8f98c8;--acc:#ff3d6e;--yel:#ffd23f;--cy:#3de8ff;--grn:#4dff88;--panel:#121730;--line:#3a4680;--pix:'Press Start 2P',ui-monospace,Menlo,monospace;--bt:68px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--pix);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 16px;touch-action:manipulation}
body.big{--bt:84px}
#wrap{position:relative;flex:none;width:min(100%,calc((100vh - 16px)*16/9));width:min(100%,calc((100dvh - 16px)*16/9));max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;box-shadow:0 0 0 2px var(--line),0 0 40px #3de8ff22;container-type:inline-size}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px 16px;background:rgba(6,7,13,.78);overflow:auto;z-index:5}
.ov[hidden]{display:none!important}
.panel{width:100%;max-width:640px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;font-size:clamp(10px,1.7cqw,14px);line-height:1.7}
.panel h1{margin:0;font-weight:400;font-size:clamp(34px,9cqw,92px);line-height:.95;color:var(--acc);text-shadow:0 .06em #7a1030,.05em .12em #000;text-wrap:balance}
.panel h2{margin:0;font-weight:400;font-size:clamp(14px,2.8cqw,26px);color:var(--yel);text-shadow:2px 2px #000;text-wrap:balance}
.panel h3{margin:0;font-weight:400;font-size:clamp(11px,1.8cqw,15px);color:var(--cy)}
.kick{color:var(--cy);letter-spacing:.12em;margin:0}
.dim{color:var(--dim);margin:0;max-width:52ch}
.menu{display:flex;flex-direction:column;gap:8px;width:min(100%,340px)}
.btn{font:inherit;font-size:1em;color:var(--ink);background:var(--panel);border:2px solid var(--line);min-height:46px;padding:.7em 1em;cursor:pointer;border-radius:4px;touch-action:manipulation;text-align:center}
.btn:hover,.btn:focus-visible{background:var(--line);outline:2px solid var(--yel);outline-offset:2px}
.btn.hot{background:#10351f;border-color:var(--grn);color:#c6ffd9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.opt i{font-style:normal;color:var(--yel)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 18px;width:min(100%,380px);text-align:left;font-variant-numeric:tabular-nums}
.stats b{font-weight:400;color:var(--yel);text-align:right}
.stats .tot{color:var(--grn);border-top:1px solid var(--line);padding-top:4px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px;width:100%}
.item{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:left;line-height:1.6}
.item span{display:flex;justify-content:space-between;gap:8px}
.item small{color:var(--dim);font-size:.85em}
.item .c{color:var(--yel);font-style:normal}
.pips{color:var(--cy);letter-spacing:2px}
.coins{color:var(--yel);margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;text-align:left;width:min(100%,520px)}
.keys b{font-weight:400;color:var(--yel)}
ol.rank{list-style:none;padding:0;margin:0;width:min(100%,480px);font-variant-numeric:tabular-nums}
ol.rank li{display:grid;grid-template-columns:2.6em 3.6em 1fr auto;gap:8px;padding:4px 6px;border-bottom:1px solid var(--panel);text-align:left}
ol.rank li:first-child{color:var(--yel)}
ol.rank li.me{background:#10351f;color:#c6ffd9}
ol.rank .x{color:var(--dim)}
#tag{font:inherit;font-size:16px;width:6em;min-height:46px;text-transform:uppercase;text-align:center;background:#000;color:var(--yel);border:2px solid var(--line);padding:.5em;border-radius:4px;-webkit-user-select:text;user-select:text}
#tag:focus-visible{outline:2px solid var(--yel)}
.note{color:var(--grn);min-height:1.7em;margin:0}

/* ---- mandos tactiles ---- */
#touch{display:none;position:relative;width:100%;touch-action:none}
body.touch #touch{display:flex}
#stick{position:relative;flex:1;min-width:0;touch-action:none}
#stick .base,#stick .knob{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#stick .base{width:calc(var(--bt)*1.7);height:calc(var(--bt)*1.7);border:2px solid var(--line);background:#12173088}
#stick .knob{width:calc(var(--bt)*.8);height:calc(var(--bt)*.8);background:var(--line);border:2px solid var(--cy)}
#stick .lbl{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px;color:var(--dim);pointer-events:none}
#btns{display:grid;grid-template-columns:repeat(2,var(--bt));grid-template-areas:"bs da" "f j";gap:12px;align-content:end;padding-bottom:8px}
#btns button,#tp{font-family:var(--pix);font-size:10px;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:50%;touch-action:none;padding:0;width:var(--bt);height:var(--bt);-webkit-tap-highlight-color:transparent}
#btns .j{grid-area:j;border-color:var(--cy);background:#0f2c36}
#btns .f{grid-area:f;border-color:var(--acc)}
#btns .f.auto{border-style:dashed}
#btns .bs{grid-area:bs;border-color:var(--yel)}
#btns .da{grid-area:da;border-color:var(--grn)}
#btns button.on,#tp.on{background:var(--line);transform:scale(.94)}
#btns .bs.ready{background:#4a3a08;box-shadow:0 0 14px var(--yel)}
#tp{position:absolute;top:6px;right:0;width:44px;height:44px;border-radius:8px;font-size:11px}
#rot{position:absolute;top:10px;left:0;right:56px;text-align:left;font-size:9px;color:var(--dim);line-height:1.6;pointer-events:none}
body:not(.ingame) #touch .ctl{visibility:hidden}

@media (orientation:portrait){
  body.touch{justify-content:flex-start;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  body.touch #wrap{width:100%}
  body.touch #touch{flex:1;min-height:0;align-items:stretch;gap:12px;padding-top:56px;padding-bottom:env(safe-area-inset-bottom,0px)}
  body.touch #stick .base{left:50%;top:60%}
  body.touch #stick .knob{left:50%;top:60%}
}
@media (orientation:landscape){
  body.touch{padding:0 16px}
  body.touch #wrap{width:min(100%,calc(100vh*16/9));width:min(100%,calc(100dvh*16/9))}
  body.touch #touch{position:fixed;inset:0;z-index:4;pointer-events:none}
  body.touch #stick{position:absolute;left:0;bottom:0;width:42%;height:72%;pointer-events:auto}
  body.touch #stick .base{left:calc(var(--bt)*1.1 + env(safe-area-inset-left,0px));top:calc(100% - var(--bt)*1.1)}
  body.touch #stick .knob{left:calc(var(--bt)*1.1 + env(safe-area-inset-left,0px));top:calc(100% - var(--bt)*1.1)}
  body.touch #stick .lbl{display:none}
  body.touch #btns{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;pointer-events:auto;opacity:.62}
  body.touch #tp{top:8px;right:calc(8px + env(safe-area-inset-right,0px));pointer-events:auto;opacity:.7}
  body.touch #rot{display:none}
}
body.touch .ov,.ov.full{position:fixed;padding:16px calc(16px + env(safe-area-inset-right,0px)) 16px calc(16px + env(safe-area-inset-left,0px));background:rgba(6,7,13,.92)}
body.touch .panel{font-size:clamp(10px,2.6vw,13px)}
body.touch .panel h1{font-size:clamp(36px,13vw,80px)}
@media (max-width:700px){.ov{position:fixed;padding:16px;background:rgba(6,7,13,.92)}.panel{font-size:clamp(10px,2.6vw,13px)}}
@media (orientation:landscape){body.touch .panel h1{font-size:clamp(28px,min(12vw,15vh),80px)}body.touch .panel{gap:8px}body.touch .menu{display:grid;grid-template-columns:1fr 1fr;width:min(100%,560px)}body.touch .menu .hot{grid-column:1/-1}}
@media (orientation:landscape){body.touch #stick:not(.act) .base,body.touch #stick:not(.act) .knob{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c" width="1280" height="720" aria-label="Dub Siege, juego de plataformas y disparos"></canvas>
  <div id="ov" class="ov" hidden></div>
</div>
<div id="touch">
  <div id="stick" class="ctl" aria-label="Zona de movimiento: arrastra para moverte y apuntar"><div class="base"></div><div class="knob"></div><span class="lbl">ARRASTRA PARA MOVER / APUNTAR</span></div>
  <div id="btns" class="ctl"><button class="bs" data-k="B">BASS</button><button class="da" data-k="DA">DASH</button><button class="f" data-k="F">FUEGO</button><button class="j" data-k="J">SALTO</button></div>
  <button id="tp" class="ctl" data-k="P" aria-label="Pausa">II</button>
  <p id="rot" class="ctl">GIRA EL MOVIL PARA<br>VER EL JUEGO MAS GRANDE</p>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var cv=$('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
var W=320,H=180,T=12,ROWS=15,GY=13*T;
// SC: el lienzo tiene SC veces mas pixeles reales que el mundo logico (320x180).
// Todo el dibujo sigue en coordenadas logicas: draw() aplica la escala una sola
// vez, asi que fisica, colisiones y cajas no cambian. Los sprites de imagen se
// pintan a su tamano nativo (SC veces la caja logica), o sea 1:1 sin perdida.
var SC=4;
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var DEBUG=location.hash==='#debug';
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(n){var v=Math.sin(n*91.7+17.3)*24634.6345;return v-Math.floor(v);}
function rng(s){s=s>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function hitR(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function hitO(a,b){return hitR(a.x,a.y,a.w,a.h,b.x,b.y,b.w,b.h);}
function pad(n,l){n=Math.max(0,Math.floor(n));return ('00000000'+n).slice(-l);}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}

// ================= configuracion =================
var SET=load('ds2_set',{});
(function(){var d={diff:1,mute:false,auto:null,assist:true,touch:'auto',big:false,vib:true,upJump:false,tut:false,help:false};for(var k in d)if(SET[k]===undefined)SET[k]=d[k];})();
function touchMode(){if(SET.touch==='on')return true;if(SET.touch==='off')return false;return matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(pointer:fine)').matches);}
function autoFire(){return SET.auto===null?touchMode():SET.auto;}
function buzz(ms){if(!SET.vib||!touchMode())return;try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
var layoutKey='';
function applyLayout(){var k=[touchMode(),SET.big,mode==='play'||mode==='pause'].join();if(k===layoutKey)return;layoutKey=k;
  document.body.classList.toggle('touch',touchMode());document.body.classList.toggle('big',!!SET.big);document.body.classList.toggle('ingame',mode==='play'||mode==='pause');
  var f=document.querySelector('#btns .f');if(f)f.classList.toggle('auto',autoFire());}
var DIFFS=[
  {n:'FACIL',lives:5,hp:5,eHp:.7,bs:.8,rate:.7,inv:120},
  {n:'NORMAL',lives:3,hp:4,eHp:1,bs:1,rate:1,inv:95},
  {n:'DIFICIL',lives:2,hp:3,eHp:1.35,bs:1.2,rate:1.3,inv:80}
];
var D=DIFFS[SET.diff];
var STAGES=[
  {name:'CALLE',sub:'BARRIO DORMIDO',sky:['#05061a','#1d2050'],gnd:'#232842',top:'#5a6390',tex:'#2c3252',tier:1,boss:'EL SILENCIADOR'},
  {name:'AZOTEAS',sub:'ATARDECER EN LOS TEJADOS',sky:['#26103a','#ff7a4a'],gnd:'#4a2626',top:'#d0703a',tex:'#5c3030',tier:2,boss:'DRON PIRATA'},
  {name:'METRO',sub:'LINEA FANTASMA',sky:['#07080c','#171a24'],gnd:'#2b2d33',top:'#9aa0aa',tex:'#34363e',tier:2,boss:'TREN FANTASMA'},
  {name:'CLUB',sub:'EL GRAN SOUND CLASH',sky:['#0c0414','#2e0a3e'],gnd:'#1a0f24',top:'#ff3d6e',tex:'#24152f',tier:3,boss:'EL CENSOR'}
];

// ================= trozos de nivel (alineados abajo, fila 14 = suelo) =================
var CH={
  start:{t:0,r:['............o.o.o.......','........................','########################','########################']},
  cp:{t:0,r:['...........K............','########################','########################']},
  box:{t:0,r:['...........*............','..........===...........','........................','...w..............h.....','########################','########################']},
  arena:{t:0,r:['...........................','....====...........====....','...........................','...........................','...........................','###########################','###########################']},
  a:{t:1,r:['..........ooo...........','.........=====..........','........................','....===.........===.....','..............w.........','...w....................','########################','########################']},
  b:{t:1,r:['..........o.............','.....o...===...o........','....===.......===.......','........................','........................','#######..........#######','#######..........#######']},
  c:{t:1,r:['...........f............','........................','..f.....................','........................','........................','.....^^^.......^^^......','########################','########################']},
  e:{t:1,r:['..ooo...........ooo.....','.=====.........=====....','........................','.........s..........w...','########################','########################']},
  j:{t:1,r:['.....o..o..o..o..o......','........................','..........+.............','########################','########################']},
  d:{t:2,r:['................t.......','...............###......','......o........###......','.....===.......###......','...............###......','########################','########################']},
  f:{t:2,r:['.................####...','.............####.......','.........####...........','.....h..................','.................h......','########################','########################']},
  gb:{t:2,r:['..b.................b...','........................','........................','........................','......=====.....=====...','........................','........+...............','########################','########################']},
  h:{t:2,r:['........ooooo...........','........................','....M...................','........................','........................','###..................###','###..................###']},
  i:{t:2,r:['..t..................t..','.###................###.','........................','........=======.........','........................','.........^^^^^^.........','########################','########################']},
  k:{t:3,r:['.......f.........f......','........................','........................','...........===..........','........................','....w..h.......t...w....','########################','########################']}
};
function chunkGrid(c){
  var r=c.r,len=0,i,out=[];for(i=0;i<r.length;i++)len=Math.max(len,r[i].length);
  for(i=0;i<ROWS-r.length;i++)out.push('');
  return out.concat(r).map(function(s){while(s.length<len)s+='.';return s;});
}

// ================= estado =================
var mode='menu',t=0,sh=0,hs=0,flash=0,flashC='#fff',beat=0;
var run,st,p,map,COLS,cam=0;
var bullets,ebul,enemies,pickups,parts,pops,ghosts,mplats,hazards,trains,boss,banner,ring;

function newRun(){
  D=DIFFS[SET.diff];
  run={score:0,lives:D.lives,coins:0,maxHp:D.hp,up:{hp:0,rate:0,dash:0,bass:0},wpn:'N',lv:1,stage:0,bass:0,conts:0,
       stats:{kills:0,shots:0,hits:0,deaths:0,time:0},combo:0,comboT:0,mult:1};
}
function buildStage(n){
  var R=rng(4242+n*977),S=STAGES[n],pool=[],k;
  for(k in CH)if(CH[k].t>0&&CH[k].t<=S.tier)pool.push(k);
  var seq=['start'],last='';
  function pick(){var c;do{c=pool[Math.floor(R()*pool.length)];}while(c===last&&pool.length>1);last=c;return c;}
  for(k=0;k<4;k++)seq.push(pick());seq.push('cp');
  for(k=0;k<4;k++)seq.push(pick());
  if(n>=1&&seq.indexOf('h')<0)seq[7]='h';
  seq.push('box','arena');
  var grids=seq.map(function(s){return chunkGrid(CH[s]);});
  COLS=grids.reduce(function(a,gr){return a+gr[0].length;},0);
  map=new Uint8Array(COLS*ROWS);
  var ents=[],x0=0,arenaX=0;
  grids.forEach(function(gr,ci){
    if(seq[ci]==='arena')arenaX=x0*T;
    for(var y=0;y<ROWS;y++)for(var x=0;x<gr[y].length;x++){
      var ch=gr[y][x],cx=x0+x;
      if(ch==='#')map[y*COLS+cx]=1;else if(ch==='=')map[y*COLS+cx]=2;else if(ch==='^')map[y*COLS+cx]=3;
      else if(ch!=='.')ents.push({ch:ch,x:cx*T,y:y*T});
    }
    x0+=gr[0].length;
  });
  st={n:n,S:S,arenaX:arenaX,lock:0,bossDone:0,clearT:0,cp:{x:36,y:GY-14},cps:[],t:0,hurtFree:1,coinsAt:run.coins};
  bullets=[];ebul=[];enemies=[];pickups=[];parts=[];pops=[];ghosts=[];mplats=[];hazards=[];trains=[];boss=null;ring=null;
  ents.forEach(function(e){
    if(e.ch==='o')pickups.push({type:'coin',x:e.x+2,y:e.y+2,w:8,h:8,stat:1,l:-1});
    else if(e.ch==='+')pickups.push({type:'hp',x:e.x+2,y:e.y+4,w:8,h:8,stat:1,l:-1});
    else if(e.ch==='K')st.cps.push({x:e.x,y:e.y-4,on:0});
    else if(e.ch==='M')mplats.push({x:e.x,y:e.y,w:44,h:5,x0:e.x,rg:150,ph:0,dx:0});
    else mkEnemy(e.ch,e.x,e.y);
  });
  p={x:36,y:GY-14,w:8,h:14,vx:0,vy:0,face:1,ground:0,onOne:0,onMp:null,coyote:0,jbuf:0,jumps:0,airDash:1,dash:0,dashCd:0,drop:0,
     inv:60,cool:0,mf:0,anim:0,hp:run.maxHp,dead:0,deadT:0,safe:{x:36,y:GY-14},aimU:0,aimD:0};
  cam=0;banner={a:'FASE '+(n+1),b:S.name+' - '+S.sub,l:170};
  songIdx=n;bossMusic=0;
}
var EDEF={w:{w:10,h:8,hp:2,pts:10},h:{w:10,h:9,hp:3,pts:20},f:{w:10,h:7,hp:1,pts:15},t:{w:10,h:10,hp:4,pts:25},s:{w:11,h:13,hp:4,pts:30},b:{w:14,h:8,hp:3,pts:25},'*':{w:10,h:10,hp:2,pts:5}};
function mkEnemy(ch,x,y){
  var d=EDEF[ch];if(!d)return;
  var hp=ch==='*'?d.hp:Math.max(1,Math.round(d.hp*D.eHp*(1+st.n*.2)));
  var e={type:ch,x:x+(T-d.w)/2,y:y+T-d.h,w:d.w,h:d.h,hp:hp,max:hp,pts:d.pts,vx:0,vy:0,dir:-1,fl:0,a:Math.random()*9,cd:60+Math.random()*60,ground:0,base:y,turn:0,dive:0,jt:40+Math.random()*30,sp:.45+st.n*.08+Math.random()*.15};
  enemies.push(e);return e;
}

// ================= mapa y fisica =================
function tileAt(cx,cy){if(cx<0||cx>=COLS)return 1;if(cy<0||cy>=ROWS)return 0;return map[cy*COLS+cx];}
function moveX(o){
  o.x+=o.vx;var y0=Math.floor(o.y/T),y1=Math.floor((o.y+o.h-.01)/T),cx,cy;
  if(o.vx>0){cx=Math.floor((o.x+o.w-.01)/T);for(cy=y0;cy<=y1;cy++)if(tileAt(cx,cy)===1){o.x=cx*T-o.w;o.vx=0;return 1;}}
  else if(o.vx<0){cx=Math.floor(o.x/T);for(cy=y0;cy<=y1;cy++)if(tileAt(cx,cy)===1){o.x=(cx+1)*T;o.vx=0;return 1;}}
  return 0;
}
function moveY(o){
  var pb=o.y+o.h,cx,cy,x0,x1;o.y+=o.vy;o.ground=0;o.onOne=0;
  x0=Math.floor(o.x/T);x1=Math.floor((o.x+o.w-.01)/T);
  if(o.vy>=0){cy=Math.floor((o.y+o.h)/T);
    for(cx=x0;cx<=x1;cx++){var tt=tileAt(cx,cy);
      if(tt===1||(tt===2&&!(o.drop>0)&&pb<=cy*T+.5)){o.y=cy*T-o.h;o.vy=0;o.ground=1;o.onOne=tt===2;break;}}
  }else{cy=Math.floor(o.y/T);for(cx=x0;cx<=x1;cx++)if(tileAt(cx,cy)===1){o.y=(cy+1)*T;o.vy=0;break;}}
  return pb;
}
function onMplat(o,pb){
  if(o.vy<0||o.drop>0)return null;

    if(q.home>0){q.home--;var v=aimAt(q.x,q.y,1.25*D.bs);q.vx+=(v[0]-q.vx)*.04;q.vy+=(v[1]-q.vy)*.04;}
    q.vy+=q.gr;q.x+=q.vx;q.y+=q.vy;
    var dead=--q.l<=0||q.y>GY-2&&(q.gr>0||q.bomb);
    if(!dead&&q.y>0&&tileAt(Math.floor(q.x/T),Math.floor(q.y/T))===1)dead=true;
    if(!dead&&hitR(p.x+1,p.y+1,p.w-2,p.h-2,q.x-q.r+1,q.y-q.r+1,q.r*2-2,q.r*2-2)){hurt(1);dead=true;}
    if(dead){burst(q.x,q.y,[q.c,'#fff'],q.bomb?12:5,q.bomb?2.2:1.2);if(q.bomb){sfx('box');if(Math.abs(p.x+4-q.x)<16&&p.y+p.h>GY-18)hurt(1);}ebul.splice(k,1);}
    else if(q.x<cam-40||q.x>cam+W+40)ebul.splice(k,1);

function updatePickups(){

      if(k.y+k.h>=GY&&tileAt(Math.floor((k.x+4)/T),Math.floor((k.y+k.h)/T))===1){k.y=Math.floor((k.y+k.h)/T)*T-k.h;k.vy=0;}
      else{var cy=Math.floor((k.y+k.h)/T),tt=tileAt(Math.floor((k.x+4)/T),cy);if(k.vy>0&&(tt===1||tt===2)&&k.y+k.h-k.vy<=cy*T+1){k.y=cy*T-k.h;k.vy=0;}}}
    var mag=k.type==='coin'?6:0;
    if(!p.dead&&hitR(p.x-mag,p.y-mag,p.w+mag*2,p.h+mag*2,k.x,k.y,k.w,k.h)){
      if(k.type==='coin'){run.coins++;run.score+=5;addBass(1.5);sfx('coin');burst(k.x+4,k.y+4,['#ffd23f'],4,1);}
      else if(k.type==='hp'){if(p.hp<run.maxHp)p.hp++;else run.score+=100;pop(k.x-8,k.y-6,'+VIDA','#4dff88');sfx('pick');}

}

    spike=tileAt(Math.floor((p.x+p.w+10)/T),12)===3||tileAt(Math.floor((p.x+p.w+22)/T),12)===3,wall=tileAt(Math.floor((p.x+p.w+6)/T),Math.floor((p.y+8)/T))===1,
    en=enemies.some(function(e){return !e.dead&&e.type!=='t'&&e.x-p.x>-6&&e.x-p.x<34&&Math.abs(e.y-p.y)<24;}),
    eb=ebul.some(function(q){return Math.abs(q.x-p.x)<40&&Math.abs(q.y-(p.y+7))<14;});
    var mn=mplats.filter(function(m){return m.x+m.w-p.x>-10&&m.x-p.x<230;})[0];return {mpNear:!!mn,mpReady:!!mn&&mn.x-(p.x+p.w)<6&&mn.x+mn.w>p.x+p.w+10,onMp:!!p.onMp,pit:pit,spike:spike,wall:wall,en:en,eb:eb,g:p.ground,boss:!!(boss&&boss.on),bx:boss?boss.x-p.x:0,lock:st.lock,train:trains.length>0||(boss&&boss.act==='train'),laser:hazards.some(function(h){return h.k==='laser';}),wave:hazards.some(function(h){return h.k==='wave'&&Math.abs(h.x-p.x)<40;})};}
