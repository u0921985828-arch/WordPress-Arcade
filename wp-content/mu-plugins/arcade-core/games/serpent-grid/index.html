<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serpent Grid</title>
<style>
  :root{--bg:#1b1f3b;--grid:#232850;--snake:#f2d15c;--head:#fff4c2;--food:#ff6b6b;--ink:#f5f1e6}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
  #hud{display:flex;justify-content:space-between;font-weight:700;font-size:18px;letter-spacing:.02em}
  canvas{display:block;image-rendering:pixelated;border-radius:6px}
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;pointer-events:none}
  #msg h1{margin:0;font-size:clamp(28px,8vmin,48px);color:var(--snake)}
  #msg p{margin:0;font-size:clamp(14px,3.6vmin,18px);opacity:.9}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span id="score">0</span><span id="best">Récord 0</span></div>
  <canvas id="c"></canvas>
</div>
<div id="msg"><h1>Serpent Grid</h1><p id="sub">Toca o pulsa espacio para empezar</p><p>Desliza · Flechas · WASD · Mando</p></div>
<script>
(() => {
  const N = 20, cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $score = document.getElementById('score'), $best = document.getElementById('best');
  const $msg = document.getElementById('msg'), $sub = document.getElementById('sub'), $hud = document.getElementById('hud');
  const DIR = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
  let size, cell, snake, dir, queue, food, score, state = 'ready', timer = 0, last = 0, step;
  let best = 0; try { best = +localStorage.getItem('serpent-grid-best') || 0; } catch {}
  $best.textContent = 'Récord ' + best;

  function fit() {
    const hudH = 34, s = Math.floor(Math.min(innerWidth - 16, innerHeight - hudH - 24) / N) * N;
    size = Math.max(N * 8, s); cell = size / N;
    const dpr = window.devicePixelRatio || 1;
    cv.width = cv.height = size * dpr; cv.style.width = cv.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    $hud.style.width = size + 'px';
    draw();
  }

  function reset() {
    snake = [[9,10],[8,10],[7,10]]; dir = 'right'; queue = []; score = 0; step = 140;
    $score.textContent = 0; placeFood();
  }
  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if (!snake.some(s => s[0] === x && s[1] === y)) free.push([x, y]);
    food = free[Math.floor(Math.random() * free.length)];
  }

  function turn(d) {
    if (state !== 'playing') { if (state !== 'paused') start(); return; }
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    const [a, b] = DIR[d], [c, e] = DIR[lastDir];
    if (d === lastDir || (a === -c && b === -e) || queue.length >= 2) return;
    queue.push(d);
  }

  function start() { reset(); state = 'playing'; $msg.classList.add('hide'); last = performance.now(); timer = 0; }
  function gameOver() {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('serpent-grid-best', best); } catch {} $best.textContent = 'Récord ' + best; }
    $msg.querySelector('h1').textContent = 'Fin';
    $sub.textContent = 'Puntos: ' + score + ' · Toca para repetir';
    $msg.classList.remove('hide');
    navigator.vibrate?.(80);
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIR[dir], h = snake[0];
    const nx = h[0] + dx, ny = h[1] + dy;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N || snake.some((s, i) => i < snake.length - 1 && s[0] === nx && s[1] === ny)) return gameOver();
    snake.unshift([nx, ny]);
    if (nx === food[0] && ny === food[1]) {
      score++; $score.textContent = score; step = Math.max(65, step - 3);
      if (snake.length === N * N) return gameOver();
      placeFood();
    } else snake.pop();
  }

  function draw() {
    if (!snake) return;
    ctx.fillStyle = '#1b1f3b'; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#232850';
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if ((x + y) % 2) ctx.fillRect(x * cell, y * cell, cell, cell);
    const p = Math.max(1, cell * .1);
    ctx.fillStyle = '#ff6b6b'; ctx.fillRect(food[0] * cell + p * 1.5, food[1] * cell + p * 1.5, cell - p * 3, cell - p * 3);
    snake.forEach((s, i) => {
      ctx.fillStyle = i ? '#f2d15c' : '#fff4c2';
      ctx.fillRect(s[0] * cell + p, s[1] * cell + p, cell - p * 2, cell - p * 2);
    });
  }

  // Bucle con paso fijo + sondeo de mando.
  let padPrev = {};
  function loop(t) {
    pollPad();
    if (state === 'playing') {
      timer += t - last;
      while (timer >= step && state === 'playing') { timer -= step; tick(); }
    }
    last = t; draw(); requestAnimationFrame(loop);
  }
  function pollPad() {
    const gp = [...(navigator.getGamepads?.() || [])].find(Boolean); if (!gp) return;
    const b = i => gp.buttons[i]?.pressed, ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const now = { up: b(12) || ay < -.6, down: b(13) || ay > .6, left: b(14) || ax < -.6, right: b(15) || ax > .6, a: b(0) || b(9) };
    for (const k of ['up','down','left','right']) if (now[k] && !padPrev[k]) turn(k);
    if (now.a && !padPrev.a && state !== 'playing') start();
    padPrev = now;
  }

  // Teclado (también recibe las teclas del pad virtual del portal).
  const KEYMAP = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
  function onKey(e) {
    const d = KEYMAP[e.code];
    if (d) { e.preventDefault(); turn(d); }
    else if ((e.code === 'Space' || e.code === 'Enter') && state !== 'playing') { e.preventDefault(); start(); }
  }
  addEventListener('keydown', onKey);
  // Puente postMessage para portales cross-origin.
  addEventListener('message', e => { const d = e.data; if (d?.type === 'arcade:key' && d.event === 'keydown') onKey({ code: d.code, preventDefault(){} }); });

  // Swipe táctil.
  let t0 = null;
  addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; t0 = [t.clientX, t.clientY]; }, { passive: false });
  addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  addEventListener('touchend', e => {
    e.preventDefault(); if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0[0], dy = t.clientY - t0[1]; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) { if (state !== 'playing') start(); return; }
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: false });
  addEventListener('mousedown', () => { if (state !== 'playing') start(); });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') { state = 'paused'; $sub.textContent = 'Pausa · Toca para seguir'; $msg.querySelector('h1').textContent = 'Pausa'; $msg.classList.remove('hide'); }
  });
  // Reanudar desde pausa sin reiniciar.
  const resume = () => { if (state === 'paused') { state = 'playing'; $msg.classList.add('hide'); last = performance.now(); timer = 0; return true; } };
  const _start = start; start = () => { if (!resume()) _start(); };

  addEventListener('resize', fit);
  reset(); fit(); requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
