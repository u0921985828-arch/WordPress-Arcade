<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mancala de Semillas</title></head>
<body><script>window.CFG={"mode": "kalah", "help": "Cada uno tiene seis hoyos con cuatro semillas y un granero al final de su fila. Toca uno de tus hoyos: coges todas sus semillas y las vas dejando de una en una en los hoyos siguientes, saltándote siempre el granero del rival. Si la última semilla cae justo en tu granero, repites turno. Si cae en un hoyo tuyo que estaba vacío, te llevas esa semilla y todas las del hoyo de enfrente. La partida acaba cuando alguien se queda sin semillas en su lado: el otro recoge las suyas y gana quien más tenga en el granero.", "title": "Mancala de Semillas", "id": "mancala-de-semillas", "pad": {"d": "8", "a": "Sembrar", "b": "", "t": 1}, "mp": [1, 2]};</script><script src="../_lib/kit.js?v=23"></script><script src="../_lib/art.js?v=f268e05f"></script><script src="../_lib/mancala.js?v=d580ed2d"></script></body></html>
