<body><script>window.CFG={"mode": "fruta", "hud": "bl", "help": "Mueve la fruta con el dedo, el ratón o ← → y suéltala tocando la pantalla o con A. Dos frutas iguales que se tocan se funden en la siguiente: cereza, fresa, uva, mandarina, naranja, kiwi, manzana, pomelo, melocotón, melón y sandía. Hay veinte niveles, cada uno con su objetivo arriba (consigue una fruta, haz un encargo, suma puntos, libera la fruta helada o rompe piedras) y las frutas contadas. Las piedras no se funden; las bombas estallan al tocar algo, rompen piedras y se llevan cerezas y fresas; la fruta helada se libera con una fusión a su lado. En el Exprimidor todo cae hacia el centro y se apunta por ángulo. Desde el nivel 10, B o el botón de la flecha deshacen la última fruta. El tarro rebosa si una fruta se queda quieta sobre la línea de puntos. En el menú hay también un modo libre sin fin.", "title": "Fusión de Frutas", "id": "fusion-de-frutas", "pad": {"d": "h", "a": "Soltar", "b": "Deshacer", "t": 1}};</script><script src="../_lib/kit.js?v=32"></script><script src="../_lib/art.js?v=f268e05f"></script><script src="../_lib/burblv.js?v=10f7d435"></script><script src="../_lib/frutlv.js?v=d00a75e7"></script><script src="../_lib/burbujas.js?v=df60c5c3"></script></body></html>
