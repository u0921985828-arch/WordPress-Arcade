<body><script>window.CFG={"mode": "vias", "help": "Coloca tramos de vía en la rejilla para que la locomotora salga de la cochera, recoja los vagones <b>por orden</b> (1, 2, 3…) y termine en la estación. Toca una casilla libre para poner la pieza elegida; vuelve a tocarla para girarla y, tras la cuarta vuelta, para quitarla. La <b>vía</b> manda al tren en una dirección fija; el <b>cambio de agujas</b> alterna: la primera vez sale recto y la siguiente girando. Los cruces dejan pasar de largo, los túneles te llevan a su gemelo y las rocas descarrilan el tren. Cuando el plano esté listo pulsa Arrancar. Cada nivel tiene un mínimo de piezas: igualarlo es la mejor manera de pasarlo.", "title": "Vías del Valle", "id": "vias-del-valle", "pad": {"d": "8", "a": "Poner vía", "b": "Cambiar pieza", "t": 1}};</script><script src="../_lib/kit.js?v=28"></script><script src="../_lib/art.js?v=f268e05f"></script><script src="../_lib/tren.js?v=1a70e3f6"></script></body></html>
