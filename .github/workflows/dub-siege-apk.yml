name: Dub Siege APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar en la descarga fija
        type: boolean
        default: false
  push:
    branches: [ claude/new-session-6j6z2y, main ]
    paths:
      - 'dub-siege/godot/**'
      - 'dub-siege/art/**'
      - 'dub-siege/project.godot'
      - 'dub-siege/export_presets.cfg'
      - '.github/workflows/dub-siege-apk.yml'

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Godot y plantillas de exportación
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT}-stable
          curl -sSLo g.zip $base/Godot_v${GODOT}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSLo t.tpz $base/Godot_v${GODOT}-stable_export_templates.tpz
          d=~/.local/share/godot/export_templates/${GODOT}.stable
          mkdir -p $d
          unzip -q -j t.tpz 'templates/android_*' 'templates/version.txt' -d $d
          rm -f t.tpz g.zip; ls $d
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Exportar APK (Godot, nativo)
        working-directory: dub-siege
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/dub-siege/android/app/kuboplay.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: kuboplay
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: kuboplay
        run: |
          # versionCode siempre por encima del de la version webview (que usaba el n.º de ejecucion)
          sed -i "s/^version\/code=.*/version\/code=$((GITHUB_RUN_NUMBER + 1000))/; s/^version\/name=.*/version\/name=\"2.0.$GITHUB_RUN_NUMBER\"/" export_presets.cfg
          # Gradle (no la plantilla precompilada) para poder llevar el arreglo de «atrás» de Android 16
          tools/android-plantilla.sh "$GODOT"
          sed -i 's/^gradle_build\/use_gradle_build=.*/gradle_build\/use_gradle_build=true/; s/^gradle_build\/export_format=.*/gradle_build\/export_format=0/' export_presets.cfg
          timeout 600 godot --headless --import || true
          timeout 1800 godot --headless --export-release Android ../DubSiege.apk
          # móviles antiguos de 32 bits (armeabi-v7a)
          sed -i 's/^architectures\/arm64-v8a=true/architectures\/arm64-v8a=false/; s/^architectures\/armeabi-v7a=false/architectures\/armeabi-v7a=true/' export_presets.cfg
          timeout 1800 godot --headless --export-release Android ../DubSiege-32bit.apk
          # copia x86_64 solo para el emulador
          sed -i 's/^architectures\/armeabi-v7a=true/architectures\/armeabi-v7a=false/; s/^architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          timeout 1800 godot --headless --export-release Android ../DubSiege-x86_64.apk
      - name: App antigua (web en WebView) con una partida, para probar la actualización
        run: |
          # Solo para el emulador: la versión anterior con récord QAX 98765 y progreso en fase 4.
          sed -i '3a <script>if(!localStorage.getItem("ds2_rank")){localStorage.setItem("ds2_rank",JSON.stringify([{tag:"QAX",score:98765,st:5,d:1,ts:1}]));localStorage.setItem("ds2_tag",JSON.stringify("QAX"));localStorage.setItem("ds2_prog","[4,0,0]");}</script>' dub-siege/dub-siege.html
          cd dub-siege/android && chmod +x gradlew && ./gradlew --no-daemon -q assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../DubSiege-webview-antigua.apk
      - name: Comprobar que es nativo
        run: |
          ls -la DubSiege.apk
          unzip -l DubSiege.apk | grep -q 'arm64-v8a/libgodot_android.so'
          unzip -l DubSiege-32bit.apk | grep -q 'armeabi-v7a/libgodot_android.so'
          ls -la DubSiege-32bit.apk
          unzip -p DubSiege.apk AndroidManifest.xml | strings | grep -qi webview && { echo 'trae webview'; exit 1; } || echo 'sin webview'
          # Android 16: el botón atrás tiene que llegar al juego (pausa), no cerrar la app
          a2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          for f in DubSiege.apk DubSiege-32bit.apk DubSiege-x86_64.apk; do
            if ! $a2 dump xmltree --file AndroidManifest.xml $f | grep -q 'enableOnBackInvokedCallback.*=false'; then echo "$f sin arreglo de atrás"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: DubSiege.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: apk-emu, path: "DubSiege-x86_64.apk\nDubSiege-webview-antigua.apk", if-no-files-found: error }
      - name: Publicar en la descarga fija
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dub-siege-apk
          name: Dub Siege (APK Android)
          body: Último APK de Dub Siege (app nativa hecha con Godot). Descárgalo en el móvil y ábrelo para instalarlo.
          files: |
            DubSiege.apk
            DubSiege-32bit.apk
          prerelease: true
          make_latest: false

  aab:
    # Paquete para Google Play (Android App Bundle): Godot con compilacion Gradle,
    # 64 y 32 bits, Android 16 (API 36) y librerias alineadas a 16 KB.
    runs-on: ubuntu-latest
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Godot y plantillas de exportación
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT}-stable
          curl -sSLo g.zip $base/Godot_v${GODOT}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSLo t.tpz $base/Godot_v${GODOT}-stable_export_templates.tpz
          d=~/.local/share/godot/export_templates/${GODOT}.stable
          mkdir -p $d
          unzip -q -j t.tpz 'templates/android_*' 'templates/version.txt' -d $d
          rm -f t.tpz g.zip; ls $d
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Exportar AAB (Gradle)
        working-directory: dub-siege
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/dub-siege/android/app/kuboplay.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: kuboplay
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: kuboplay
        run: |
          # la carpeta android/ guarda la app WebView antigua; la plantilla de Godot va en android/build
          tools/android-plantilla.sh "$GODOT"
          sed -i "s/^version\/code=.*/version\/code=$((GITHUB_RUN_NUMBER + 1000))/; s/^version\/name=.*/version\/name=\"2.0.$GITHUB_RUN_NUMBER\"/" export_presets.cfg
          sed -i 's/^gradle_build\/use_gradle_build=.*/gradle_build\/use_gradle_build=true/; s/^gradle_build\/export_format=.*/gradle_build\/export_format=1/; s/^architectures\/armeabi-v7a=.*/architectures\/armeabi-v7a=true/; s/^architectures\/arm64-v8a=.*/architectures\/arm64-v8a=true/' export_presets.cfg
          sed -i 's|^export_path=.*|export_path="../DubSiege.aab"|' export_presets.cfg
          timeout 600 godot --headless --import || true
          timeout 1800 godot --headless --export-release Android ../DubSiege.aab
          ls -la ../DubSiege.aab
      - name: Comprobar el AAB (API 36, 64 bits, 16 KB, permisos, firma)
        run: |
          curl -sSLo bt.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar bt.jar dump manifest --bundle DubSiege.aab > man.xml
          grep -E 'versionCode|targetSdkVersion|minSdkVersion|uses-permission' man.xml
          grep -q 'targetSdkVersion="36"' man.xml
          if grep -q 'android.permission.INTERNET' man.xml; then echo 'pide internet'; exit 1; fi
          if [ "$(grep -c 'uses-permission' man.xml)" != 1 ]; then echo 'permisos de más'; exit 1; fi
          grep -q 'android.permission.VIBRATE' man.xml
          grep -q 'enableOnBackInvokedCallback="false"' man.xml
          unzip -l DubSiege.aab | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libgodot_android.so'
          mkdir so && unzip -q DubSiege.aab 'base/lib/*' -d so
          bad=0; for f in $(find so -name '*.so' -path '*arm64*'); do a=$(readelf -lW $f | awk '/LOAD/{print $NF}' | sort -u | head -1); echo "$f $a"; [ "$a" = 0x4000 ] || [ "$a" = 0x10000 ] || bad=1; done; [ $bad = 0 ]
          jarsigner -verify DubSiege.aab | tail -1
      - uses: actions/upload-artifact@v4
        with: { name: aab, path: DubSiege.aab, if-no-files-found: error }
      - name: Publicar el AAB en la descarga fija
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dub-siege-apk
          files: DubSiege.aab
          prerelease: true
          make_latest: false

  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34, 36]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk-emu }
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir en un emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install DubSiege-webview-antigua.apk
            adb shell monkey -p online.kuboplay.dubsiege -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof online.kuboplay.dubsiege > /dev/null || { adb shell monkey -p online.kuboplay.dubsiege -c android.intent.category.LAUNCHER 1; sleep 30; }
            adb exec-out screencap -p > 0-antigua.png
            adb shell input keyevent KEYCODE_HOME; sleep 6
            adb shell am force-stop online.kuboplay.dubsiege
            adb root || true; sleep 3; adb wait-for-device
            adb shell ls -laR /data/data/online.kuboplay.dubsiege/app_webview | head -60 || true
            for f in $(adb shell ls "/data/data/online.kuboplay.dubsiege/app_webview/Default/Local\ Storage/leveldb/" | grep -E 'log$|ldb$'); do echo "LDB $f $(adb shell base64 -w0 "/data/data/online.kuboplay.dubsiege/app_webview/Default/Local\ Storage/leveldb/$f")"; done || true
            adb install -r DubSiege-x86_64.apk
            adb logcat -c
            adb shell monkey -p online.kuboplay.dubsiege -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > 1-portada.png
            adb shell input keyevent KEYCODE_ENTER
            sleep 4
            adb exec-out screencap -p > 2-jugar.png
            adb shell input keyevent KEYCODE_ENTER
            sleep 4
            adb exec-out screencap -p > 3-escena.png
            adb shell input keyevent KEYCODE_ESCAPE
            sleep 6
            adb shell input keyevent KEYCODE_D
            sleep 3
            adb exec-out screencap -p > 4-partida.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb exec-out screencap -p > 5-atras.png
            adb logcat -d > logcat.txt || { sleep 3; adb logcat -d > logcat.txt; }
            grep -q 'datos importados de la app anterior' logcat.txt || { echo 'NO importó la partida antigua'; exit 1; }
            echo "proceso: $(adb shell pidof online.kuboplay.dubsiege)"; adb shell pidof online.kuboplay.dubsiege > /dev/null
            ! grep -q 'FATAL EXCEPTION' logcat.txt
      - name: Mensajes de Godot
        if: always()
        run: grep -E ' godot +:|Dub Siege' logcat.txt | head -150 || echo 'sin mensajes'
      - name: Capturas como check-runs (para revisarlas sin descargar artefactos)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pillow || true
          for f in *.png; do
            [ -f "$f" ] || continue
            python3 -c "import sys,io,base64,json;from PIL import Image;im=Image.open(sys.argv[1]).convert('RGB');im.thumbnail((640,640));b=io.BytesIO();im.save(b,'JPEG',quality=55);print(json.dumps({'name':'qa-api${{ matrix.api }}-'+sys.argv[1],'head_sha':'${{ github.sha }}','status':'completed','conclusion':'neutral','output':{'title':sys.argv[1],'summary':'captura del emulador','text':base64.b64encode(b.getvalue()).decode()}}))" "$f" > cr.json
            gh api repos/${{ github.repository }}/check-runs --input cr.json --jq .id || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-${{ matrix.api }}
          path: |
            *.png
            logcat.txt
      - name: Nombrar capturas por versión de Android
        if: always()
        run: for f in *.png logcat.txt; do [ -f "$f" ] && mv "$f" "api${{ matrix.api }}-$f"; done; ls
      - name: Capturas del emulador en una descarga aparte
        if: always() && (github.event_name == 'push' || inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dub-siege-apk-qa
          name: Dub Siege APK (capturas de prueba)
          files: |
            api*.png
            api*-logcat.txt
          prerelease: true
          make_latest: false
